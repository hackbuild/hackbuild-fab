:root{
  --bg:#f4efe3; --panel:#faf6ec; --raised:#ebe3d3; --line:#d6ccb8; --ink:#1c1812; --ash:#4a4236; --smoke:#857a68;
  --hazard:#f2ab1e; --on-hazard:#15120f; --accent-text:#9a610c; --rust:#c2542c; --fault:#b8412d; --live:#2f8a64;
  --stage:#e7dfcd; --shadow:#1c1812; --tape-a:#f2ab1e; --tape-b:#15120f;
  --display:'Archivo','Arial Narrow',Arial,sans-serif; --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15120f; --panel:#1d1915; --raised:#26211b; --line:#3a342b; --ink:#ece3d3; --ash:#a79d8c; --smoke:#8a8070;
    --accent-text:#f2ab1e; --fault:#e0604a; --live:#5fb892; --stage:#1f1b16; --shadow:#000; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15120f; --panel:#1d1915; --raised:#26211b; --line:#3a342b; --ink:#ece3d3; --ash:#a79d8c; --smoke:#8a8070;
  --accent-text:#f2ab1e; --fault:#e0604a; --live:#5fb892; --stage:#1f1b16; --shadow:#000; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);min-height:100%;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hazard);outline-offset:2px}

.top{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:2px solid var(--ink);background:var(--panel);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand h1{font:800 26px/1 var(--display);letter-spacing:.02em;margin:0;text-transform:uppercase}
.brand p{margin:0;color:var(--ash);font-size:14px}
.stats{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat b{font:500 15px var(--mono)}
.stat span{font-size:12px;color:var(--smoke)}
.tape{height:8px;background:repeating-linear-gradient(-45deg,var(--tape-a) 0 12px,var(--tape-b) 12px 24px)}

.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 14px;border:2px solid var(--ink);background:var(--panel);cursor:pointer;box-shadow:3px 3px 0 var(--shadow);font-weight:600;border-radius:0}
.btn:hover{background:var(--raised)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.primary{background:var(--hazard);color:var(--on-hazard);border-color:var(--on-hazard)}
.btn.small{min-height:34px;padding:4px 10px;font-size:14px}
.btn svg{width:16px;height:16px;flex:none}
.iconbtn{width:40px;padding:0;justify-content:center}

main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 440px;min-height:0}
.stagewrap{position:relative;min-height:420px;background:var(--stage);border-right:2px solid var(--ink)}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.viewbar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.viewbar>*{pointer-events:auto}
.seg{display:inline-flex;border:2px solid var(--ink);background:var(--panel);box-shadow:3px 3px 0 var(--shadow)}
.seg button{border:0;background:none;padding:6px 12px;min-height:36px;cursor:pointer;font-weight:600;font-size:14px}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--hazard);color:var(--on-hazard)}
.explode{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--ink);padding:4px 10px;box-shadow:3px 3px 0 var(--shadow);font-size:14px;font-weight:600}
.explode input{width:120px;accent-color:var(--hazard)}
.hud{position:absolute;left:12px;top:12px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:2px solid var(--ink);padding:6px 10px;font:500 13px/1.45 var(--mono);pointer-events:none;max-width:calc(100% - 24px)}
.hud div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loading{position:absolute;inset:0;display:grid;place-items:center;font:600 16px var(--body);color:var(--ash)}

aside{display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.tabs{display:flex;overflow-x:auto;border-bottom:2px solid var(--ink);flex:none;scrollbar-width:thin}
.tabs button{flex:1 0 auto;border:0;border-right:2px solid var(--ink);background:none;padding:10px 12px;min-height:44px;cursor:pointer;font-weight:600;font-size:14px}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.pane{flex:1;overflow-y:auto;padding:16px 16px 40px;min-height:0}
.pane h2{font:800 18px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:22px 0 10px}
.pane h2:first-child{margin-top:0}
.pane h3{font-size:15px;margin:16px 0 6px}
.pane p{margin:6px 0 10px;max-width:62ch}
.lead{color:var(--ash)}

.field{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin:0 0 12px}
.field label{font-weight:600;font-size:14px}
.field output{font:500 14px var(--mono);text-align:right;min-width:9ch}
.field input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--hazard);height:28px}
.field select{grid-column:2;min-height:36px;border:2px solid var(--ink);background:var(--bg);padding:2px 6px;border-radius:0}
.field .hint{grid-column:1/-1;font-size:13px;color:var(--smoke)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid2 .field{grid-template-columns:1fr auto}
.grid2 .field select{grid-column:1/-1;width:100%}
.checks{display:grid;gap:6px;margin:4px 0 14px}
.check{display:flex;gap:10px;align-items:center;min-height:32px;cursor:pointer;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--hazard);flex:none}
input[type=number]{width:90px;min-height:36px;border:2px solid var(--ink);background:var(--bg);padding:2px 6px;font:500 14px var(--mono);border-radius:0}

table{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0 14px}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ash);font-size:13px}
td.n,th.n{text-align:right;font-family:var(--mono);font-size:13.5px;white-space:nowrap}
.scrollx{overflow-x:auto}
.warn{border:2px solid var(--fault);padding:8px 10px;margin:8px 0 12px;font-size:14px}
.warn strong{color:var(--fault)}
.note{border-left:4px solid var(--hazard);padding:6px 10px;background:var(--raised);margin:8px 0 12px;font-size:14px}
.ok{color:var(--live);font-weight:600}
.dl{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
ol.steps{padding-left:22px;margin:6px 0 14px}
ol.steps li{margin:0 0 8px}
.svgbox{border:2px solid var(--ink);background:var(--bg);margin:6px 0 12px;overflow:hidden}
.svgbox svg{display:block;width:100%;height:auto}
.sheetgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheetgrid figure{margin:0}
.sheetgrid figcaption{font:500 12px var(--mono);color:var(--ash);margin-top:2px}

.colorrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.chip{width:34px;height:34px;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--shadow)}
.colorrow .nm{font-weight:600;font-size:14px;line-height:1.25}
.colorrow .nm small{display:block;font-weight:400;color:var(--smoke);font-size:12.5px}
.colorrow button.edit{min-height:34px}
.swatches{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;padding:6px 0 4px}
.sw{width:34px;height:34px;border:2px solid var(--ink);cursor:pointer;padding:0;position:relative}
.sw[aria-pressed="true"]{outline:3px solid var(--hazard);outline-offset:1px}
.sw.wood::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 5px,rgba(90,55,20,.25) 5px 6px)}
.custom{display:flex;align-items:center;gap:6px;font-size:13px}
.custom input{width:44px;height:34px;border:2px solid var(--ink);padding:0;background:none}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.preset{display:flex;align-items:center;gap:6px}
.preset i{display:inline-flex}
.preset i span{width:10px;height:18px;display:block}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;font-weight:600;z-index:9;display:none;max-width:90vw}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (min-width:901px){ body{height:100vh;height:100dvh;overflow:hidden} main{min-height:0;overflow:hidden} .stagewrap{min-height:0} }
@media (max-width:1500px){ .brand p{display:none} .stats{gap:14px} }
@media (max-width:900px){
  main{grid-template-columns:1fr;grid-template-rows:auto auto}
  .stagewrap{height:56svh;min-height:320px;border-right:0;border-bottom:2px solid var(--ink)}
  aside{min-height:60svh}
  .pane{overflow:visible}
  .stats{margin-left:0;width:100%;gap:14px}
  .brand h1{font-size:22px}
}
@media (max-width:600px){ .hud{display:none} .viewbar{gap:6px;left:8px;right:8px;bottom:8px} .seg button{padding:4px 9px} }
@media (max-width:420px){ .grid2{grid-template-columns:1fr} .sheetgrid{grid-template-columns:1fr} .explode input{width:84px} }
@media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important} }

<body>
<header class="top">
  <div class="brand"><h1>Gusset</h1><p>Facing 2x4 sofas and a laser cut table, in HeatSync colors</p></div>
  <div class="stats" id="stats" aria-live="polite"></div>
  <button class="btn iconbtn" id="themeBtn" aria-label="Toggle light or dark theme" title="Theme">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <button class="btn primary" id="dlAll"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>Build pack</button>
</header>
<div class="tape" aria-hidden="true"></div>
<main>
  <section class="stagewrap" aria-label="3D model of the lounge set">
    <canvas id="stage" aria-label="Interactive 3D view. Drag to orbit, scroll or pinch to zoom."></canvas>
    <div class="loading" id="loading">Loading the 3D engine</div>
    <div class="hud" id="hud"></div>
    <div class="viewbar">
      <div class="seg" role="group" aria-label="Camera view" id="views">
        <button data-view="lounge" aria-pressed="true">Lounge</button>
        <button data-view="sofa" aria-pressed="false">Sofa</button>
        <button data-view="table" aria-pressed="false">Table</button>
        <button data-view="plan" aria-pressed="false">Plan</button>
      </div>
      <label class="explode">Explode <input type="range" id="explode" min="0" max="1" step="0.01" value="0" aria-label="Explode parts apart"></label>
      <div class="seg" role="group" aria-label="Show layers">
        <button id="tCush" aria-pressed="true">Cushions</button>
        <button id="tPan" aria-pressed="true">Panels</button>
        <button id="tPeople" aria-pressed="false">People</button>
      </div>
      <button class="btn small" id="snap" title="Save a PNG of this view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="14"/><circle cx="12" cy="13" r="4"/><path d="M8 6l2-3h4l2 3"/></svg>PNG</button>
    </div>
  </section>
  <aside aria-label="Design controls">
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" aria-selected="true" data-tab="shape">Shape</button>
      <button role="tab" aria-selected="false" data-tab="color">Color</button>
      <button role="tab" aria-selected="false" data-tab="lumber">Lumber</button>
      <button role="tab" aria-selected="false" data-tab="laser">Laser</button>
      <button role="tab" aria-selected="false" data-tab="cushions">Cushions</button>
      <button role="tab" aria-selected="false" data-tab="build">Build day</button>
    </div>
    <div class="pane" id="pane" role="tabpanel"></div>
  </aside>
</main>

        const z1 = Math.min(zF(d.y0), zF(d.y1)) - 0.25, sh = [{ outer: rectP(3.75, d.y0, z1, d.y1), holes: [] }];
        const shm = side ? [{ outer: sh[0].outer.map(p => [-p[0], p[1]]), holes: [] }] : sh;
        ext(d.n, shm, T, side ? basisYZr(Wt - T) : basisYZ(T), 'side', [sx * 14, 0, 0], { panel: true });
        laser.push({ name: d.n + ' ' + (side ? 'R' : 'L'), group: 'Sofa', mat: 'side', shapes: sh, note: 'glue behind the panel edge, between the legs' });
      });
      if (P.markSides) {
        const flames = markPart('ink', msize, side ? -mcz : mcz, mcy), disc = markPart('sun', msize, side ? -mcz : mcz, mcy);
        const b1 = side ? basisYZr(Wt + T) : basisYZ(-T), b2 = side ? basisYZr(Wt + 2 * T) : basisYZ(-2 * T);
        ext('Mark disc', disc, T, b1, 'disc', [sx * 24, 0, 0], { panel: true });
        ext('Mark flames', flames, T, b2, 'flames', [sx * 28, 0, 0], { panel: true });
        laser.push({ name: 'Mark disc (side ' + (side ? 'R' : 'L') + ')', group: 'Mark', mat: 'disc', shapes: markPart('sun', msize, 0, 0), note: 'glue on first' });
        laser.push({ name: 'Mark flames (side ' + (side ? 'R' : 'L') + ')', group: 'Mark', mat: 'flames', shapes: markPart('ink', msize, 0, 0), note: 'glue over the disc, keep loose islands in place' });
      }
    }
    screws.s125 += 2 * Math.ceil((2 * (pTop - pBot)) / 6);
  }

  // laser: rear panels
  let rearInfo = null;
  if (P.rearPanels) {
    const rs0 = sBot, rs1 = (legTop + 3.5 * sa) / ca; // along the rear line
    const H = rs1 - rs0, maxW = P.sheetW - 0.5, maxH = P.sheetH - 0.5;
    const cols = Math.max(1, Math.ceil(Wt / maxW)), colW = Wt / cols;
    const rows = Math.max(1, Math.ceil(H / maxH));
    const rowCuts = [rs0]; if (rows > 1) { const mid = beams.length > 2 ? beams[1] + 0.75 : rs0 + H / 2; rowCuts.push(mid); } rowCuts.push(rs1);
    const basis = { e1: V(1, 0, 0), e2: V(0, ca, sa), n: V(0, -sa, ca), o: V(0, -3.5 * sa, zF(0) + 3.5 * ca) };
    const gaps = []; // pattern windows between beams, along s
    const bs = beams.slice().sort((p, q) => p - q);
    for (let i = 0; i < bs.length - 1; i++) gaps.push([bs[i] + 1.5 + 0.7, bs[i + 1] - 0.7]);
    const rmSize = Math.min(P.markSize * 1.1, H * 0.9);
    const rmc = [Wt / 2, (rs0 + rs1) / 2];
    const rearAvoid = P.markRear ? [markBox(rmSize, rmc[0], rmc[1])] : [];
    const panels = [];
    for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
      const x0 = c * colW, x1 = (c + 1) * colW, s0 = rowCuts[r], s1 = rowCuts[r + 1];
      const holes = [];
      gaps.forEach(g => {
        const reg = { x0: x0 + (c === 0 ? 2.5 : 2), x1: x1 - (c === cols - 1 ? 2.5 : 2), y0: Math.max(g[0], s0 + 0.6), y1: Math.min(g[1], s1 - 0.6) };
        pattern(P.rearPattern, reg, rearAvoid).forEach(h => holes.push(h));
      });
      const outer = rectP(x0, s0, x1, s1);
      ext('Rear panel', [{ outer, holes }], T, basis, 'rear', [0, 0, 16], { panel: true });
      const loc = [{ outer: outer.map(p => [p[0] - x0, p[1] - s0]), holes: holes.map(h => h.map(p => [p[0] - x0, p[1] - s0])) }];
      laser.push({ name: 'Rear panel ' + (c + 1) + (rows > 1 ? '.' + (r + 1) : ''), group: 'Sofa', mat: 'rear', shapes: loc, note: 'outside face up' });
      panels.push({ x0, x1, s0, s1 });
    }
    // seam battens behind vertical seams, only in the gaps between beams
    for (let c = 1; c < cols; c++) gaps.forEach(g => {
      if (g[1] - g[0] < 2) return;
      const xs = c * colW, outer = rectP(xs - 1.5, g[0] - 0.4, xs + 1.5, g[1] + 0.4);
      const b2 = { e1: basis.e1, e2: basis.e2, n: basis.n, o: basis.o.clone().addScaledVector(basis.n, -T) };
      ext('Seam batten', [{ outer, holes: [] }], T, b2, 'rear', [0, 0, 12], { panel: true });
      laser.push({ name: 'Seam batten', group: 'Sofa', mat: 'rear', shapes: [{ outer: rectP(0, 0, 3, g[1] - g[0] + 0.8), holes: [] }], note: 'glue behind the rear panel seam' });
    });
    if (P.markRear) {
      const b1 = { e1: basis.e1, e2: basis.e2, n: basis.n, o: basis.o.clone().addScaledVector(basis.n, T) };
      const b2 = { e1: basis.e1, e2: basis.e2, n: basis.n, o: basis.o.clone().addScaledVector(basis.n, 2 * T) };
      ext('Mark disc', mirX(markPart('sun', rmSize, rmc[0], rmc[1]), rmc[0]), T, b1, 'disc', [0, 0, 22], { panel: true });
      ext('Mark flames', mirX(markPart('ink', rmSize, rmc[0], rmc[1]), rmc[0]), T, b2, 'flames', [0, 0, 26], { panel: true });
      laser.push({ name: 'Mark disc (rear)', group: 'Mark', mat: 'disc', shapes: markPart('sun', rmSize, 0, 0), note: 'centered over the seam, hides it' });
      laser.push({ name: 'Mark flames (rear)', group: 'Mark', mat: 'flames', shapes: markPart('ink', rmSize, 0, 0), note: 'glue over the disc' });
    }
    screws.s125 += panels.length * 10;
    rearInfo = { cols, rows, H, colW };
  }

  // cushions
  const cush = [];
  const slack = (Wi - P.n * P.cushW) / (P.n + 1);
  for (let i = 0; i < P.n; i++) {
    const cx = 3 + slack * (i + 1) + P.cushW * i + P.cushW / 2;
    cush.push({ kind: 'seat', size: [P.cushW - 0.15, P.seatT, P.cushD], pos: [cx, deck + P.seatT / 2, P.cushD / 2 + 0.1], rotX: 0, ex: [0, 14, -6] });
    const H = P.backH, t = P.backT;
    const cy = deck + (H / 2) * ca + (t / 2) * sa - 0.35, cz = Zr + (H / 2) * sa - (t / 2) * ca;
    cush.push({ kind: 'back', size: [P.cushW - 0.15, H, t], pos: [cx, cy, cz], rotX: a, ex: [0, 22, -2] });
  }

  const depth = Math.max(zB(legTop), rearOut + 0.125, zB(0)) + (P.rearPanels ? 0 : 0);
  return { parts, cuts, laser, cush, screws, Wt, Wi, depth, height: P.backTop, T, a, deck, yA1, m, center, beams: beams.length, rearInfo, zF, zB, legTop, Lb, Zr };
}

/* ---------- the laser cut table (egg crate grid under a laminated top) ---------- */
function tableModel() {
  const t = P.sheetMM / IN, clr = P.clr / IN;
  const L = P.tL, D = P.tD, H = P.tH, tt = P.topLayers * t, Hb = H - tt, hm = Math.min(4, Hb / 3);
  const Lm = L - 2, Dm = D - 2, tr = P.trestleLayers * t;
  const zs = [-(D / 2 - 1.75), 0, D / 2 - 1.75];
  const xT = Lm / 2 - 3, xs = [-xT, -xT / 3, xT / 3, xT];
  const thick = x => (Math.abs(x) === xT ? tr : t);
  const parts = [], laser = [], mortises = [];
  const ext = (name, shapes, depth, basis, mat, ex) => parts.push({ type: 'ext', name, shapes, depth, basis, mat, ex: ex || [0, 0, 0] });
  const tabW = 1.5;

  // long members: spine and two aprons, slots from the bottom
  zs.forEach((z0, k) => {
    let o = [[-Lm / 2, Hb - hm]];
    xs.forEach(x => { const w = thick(x) + clr; o.push([x - w / 2, Hb - hm], [x - w / 2, Hb - hm / 2], [x + w / 2, Hb - hm / 2], [x + w / 2, Hb - hm]); });
    o.push([Lm / 2, Hb - hm], [Lm / 2, Hb]);
    const tabs = [];
    for (let i = 0; i < xs.length - 1; i++) tabs.push((xs[i] + xs[i + 1]) / 2);
    tabs.slice().reverse().forEach(tx => { o.push([tx + tabW / 2, Hb], [tx + tabW / 2, Hb + t], [tx - tabW / 2, Hb + t], [tx - tabW / 2, Hb]); mortises.push({ x: tx, z: z0, w: tabW + clr, d: t + clr }); });
    o.push([-Lm / 2, Hb]);
    const nm = k === 1 ? 'Spine' : 'Apron';
    ext(nm, [{ outer: o, holes: [] }], t, basisXY(z0 - t / 2), 'tbase', [0, 2, z0 * 0.6]);
    laser.push({ name: nm, group: 'Table', mat: 'tbase', shapes: [{ outer: o.map(p => [p[0] + Lm / 2, p[1] - (Hb - hm)]), holes: [] }], note: 'slots face down' });
  });

  // transversals: trestles (laminated, with arch feet) and short ribs, slots from the top
  xs.forEach((x0, k) => {
    const isT = Math.abs(x0) === xT, th = thick(x0), y0 = isT ? 0 : Hb - hm;
    let o = [];
    if (isT) {
      const foot = 3.25, archTop = Hb - hm - 2.25, ax0 = -Dm / 2 + foot, ax1 = Dm / 2 - foot, r = Math.min(archTop - 1, (ax1 - ax0) / 2);
      o.push([-Dm / 2, 0], [ax0, 0]);
      const cxA = (ax0 + ax1) / 2, flat = (ax1 - ax0) / 2 - r;
      o.push([ax0, archTop - r]);
      arcP(cxA - flat, archTop - r, r, Math.PI, Math.PI / 2, 8).slice(1).forEach(p => o.push(p));
      arcP(cxA + flat, archTop - r, r, Math.PI / 2, 0, 8).slice(flat > 0.01 ? 0 : 1).forEach(p => o.push(p));
      o.push([ax1, 0], [Dm / 2, 0]);
    } else o.push([-Dm / 2, y0], [Dm / 2, y0]);
    o.push([Dm / 2, Hb]);
    const tabZ = [(zs[1] + zs[2]) / 2, (zs[0] + zs[1]) / 2];
    const slot = z => { const w = t + clr; return [[z + w / 2, Hb], [z + w / 2, Hb - hm / 2], [z - w / 2, Hb - hm / 2], [z - w / 2, Hb]]; };
    const tab = z => [[z + tabW / 2, Hb], [z + tabW / 2, Hb + t], [z - tabW / 2, Hb + t], [z - tabW / 2, Hb]];
    [zs[2], tabZ[0], zs[1], tabZ[1], zs[0]].forEach((z, i) => { (i % 2 ? tab(z) : slot(z)).forEach(p => o.push(p)); });
    o.push([-Dm / 2, Hb]);
    tabZ.forEach(z => mortises.push({ x: x0, z, w: th + clr, d: tabW + clr, rot: true }));
    const nm = isT ? 'Trestle' : 'Rib';
    ext(nm, [{ outer: o, holes: [] }], th, basisYZ(x0 + th / 2), 'tbase', [x0 * 0.35, isT ? -1 : 3, 0]);
    const loc = [{ outer: o.map(p => [p[0] + Dm / 2, p[1] - y0]), holes: [] }];
    const layers = isT ? P.trestleLayers : 1;
    for (let l = 0; l < layers; l++) laser.push({ name: nm + (layers > 1 ? ' layer ' + (l + 1) : ''), group: 'Table', mat: 'tbase', shapes: loc, note: isT ? 'glue the layers face to face' : 'slots face up' });
  });

  // top: lower layer with mortises, upper layer with the flames cut through
  const r = 1.5, outer = rrectP(-L / 2, -D / 2, L / 2, D / 2, r, 8);
  const holes = mortises.map(mz => { const w = mz.rot ? mz.w : mz.w, d = mz.rot ? mz.d : mz.d; return mz.rot ? rectP(mz.x - w / 2, -mz.z - d / 2, mz.x + w / 2, -mz.z + d / 2) : rectP(mz.x - w / 2, -mz.z - d / 2, mz.x + w / 2, -mz.z + d / 2); });
  const shift = sh => sh.map(s => ({ outer: s.outer.map(p => [p[0] + L / 2, p[1] + D / 2]), holes: s.holes.map(h => h.map(p => [p[0] + L / 2, p[1] + D / 2])) }));
  const lowerShapes = [{ outer, holes }];
  const stencil = P.markTable && P.topLayers > 1;
  const msize = Math.min(P.tableMarkSize, D - 4);
  for (let l = 0; l < P.topLayers; l++) {
    const upper = l === P.topLayers - 1 && P.topLayers > 1;
    const sh = l === 0 ? lowerShapes : [{ outer, holes: [] }];
    parts.push({ type: 'ext', name: upper ? 'Top (upper)' : 'Top (lower)', shapes: sh, depth: t, basis: basisTop(Hb + l * t), mat: l === 0 && P.topLayers > 1 ? 'inlay' : 'top', ex: [0, 8 + l * 7, 0], topTex: upper && stencil });
    let cutShapes = shift(sh);
    let extra = null;
    if (upper && stencil) extra = shift(markPart('ink', msize, 0, 0));
    laser.push({ name: upper ? 'Top upper layer' : (P.topLayers > 1 ? 'Top lower layer' : 'Top'), group: 'Table', mat: l === 0 && P.topLayers > 1 ? 'inlay' : 'top', shapes: cutShapes, extra, note: upper && stencil ? 'flames cut through. Paint the lower layer first, glue the loose islands back in their spots' : (l === 0 ? 'mortises take the tabs' : '') });
  }
  return { parts, laser, L, D, H, Hb, hm, t, stencil, msize };
}

/* ---------- box frame sofa: sled sides, straight back wall (the Seb Tech DIY style) ----------
   sideInfill 'lower': arm is open between the cushion and the cap so feet go through, panel or rails only below the seat
   sideInfill 'full' : arm filled from the seat rail to the cap, like the photo
   posts 'double' (two 2x4s, 3 in wall) or 'single' (one 2x4, 1.5 in wall); deck 'slats' or 'ply' (3/4 in) */
function sofaModelBox() {
  const T = P.sheetMM / IN, l = P.lean * DEG, cl = Math.cos(l), sl = Math.sin(l);
  // posts: 'turned' = one 2x4 per leg turned so its 3.5 in face runs side to side, floor rail laid flat (the reference build);
  // 'double' = two 2x4s per leg; 'single' = one 2x4 the usual way
  const turned = P.posts === 'turned', wT = turned ? 3.5 : P.posts === 'single' ? 1.5 : 3, layers = turned ? 1 : wT / 1.5;
  const zF = turned ? 1.5 : 3.5; // front post depth front to back
  const Wi = P.n * P.cushW + 0.5, Wt = Wi + 2 * wT, deck = P.deckH;
  const ply = P.deck === 'ply', dThk = ply ? 0.75 : 1.5, sup = deck - dThk, y0 = sup - 3.5;
  const capB = P.armH - 1.5, lower = P.sideInfill !== 'full';
  const zI = round8(P.cushD + 0.25 + P.backT * cl + P.backH * sl);
  const zBk = zI + 1.5, zP1 = turned ? zI : zI - 2; // zBk = back face of the frame, zP1 = front face of the back posts
  let depth = zBk; // grows if the back cap hangs out behind
  const Ls = round8(zP1 - zF);
  // back wall (and full arms): boards from y0 up to the cap, top one tight under it
  const H = capB - y0, k = Math.max(2, Math.floor(H / 5)), g = (H - 3.5 * k) / (k - 1);
  const slatY = []; for (let i = 0; i < k; i++) slatY.push(capB - 3.5 - i * (3.5 + g));
  slatY.sort((a, b) => a - b);
  // back wall boards: with the cap behind the top rail, the top rail runs up flush with the arm tops
  const capBehind = P.backCap === 'behind', capInside = P.backCap === 'inside', capFlush = capBehind || capInside;
  let backY = slatY;
  if (capFlush) { const Hb = P.armH - y0, gB = (Hb - 3.5 * k) / (k - 1); backY = []; for (let i = 0; i < k; i++) backY.push(P.armH - 3.5 - i * (3.5 + gB)); backY.sort((a, b) => a - b); }
  const sidePan = P.sidePanels, rearPan = P.rearPanels;
  const parts = [], cuts = [], laser = [], screws = { s3: 0, s25: 0, s125: 0 };
  const cut = (name, len, qty, note, key) => { if (qty > 0) cuts.push({ name, len: round8(len), qty, note: note || '', key: key || name }); };
  const box = (name, sx, sy, sz, cx, cy, cz, mat, ex) => parts.push({ type: 'box', name, size: [sx, sy, sz], pos: [cx, cy, cz], mat, ex: ex || [0, 0, 0] });
  const ext = (name, shapes, depthE, basis, mat, ex, extra) => parts.push(Object.assign({ type: 'ext', name, shapes, depth: depthE, basis, mat, ex: ex || [0, 0, 0] }, extra || {}));

  // side frame boards (bottoms): the floor rail, the seat rail, and anything above it when the arm is filled
  const sideY = lower ? [0, y0] : (sidePan ? [0, slatY[0], slatY[slatY.length - 1]] : [0].concat(slatY));
  const panBottom = lower ? (turned ? 1.5 : 0.25) : y0, panTop = lower ? sup : capB; // turned: panel sits on the flat floor rail

  for (const side of [0, 1]) {
    const sx = side ? 1 : -1, ex = [sx * 10, 0, 0];
    const xo = side ? Wt - 1.5 : 0, xr = sidePan ? (side ? Wt - T - 1.5 : T) : xo;
    if (turned) {
      box('Front post', 3.5, capB, 1.5, side ? Wt - 1.75 : 1.75, capB / 2, 0.75, 'frame', ex);
      box('Back post', 3.5, capB, 1.5, side ? Wt - 1.75 : 1.75, capB / 2, zI + 0.75, 'frame', ex);
      box('Floor rail', 3.5, 1.5, Ls, side ? Wt - 1.75 : 1.75, 0.75, zF + Ls / 2, 'frame', [sx * 10, -4, 0]);
    } else [[0, 3.5], [zP1, zBk]].forEach(([z0, z1]) => {
      for (let i = 0; i < layers; i++) box('Post', 1.5, capB, 3.5, (side ? Wt - 0.75 - i * 1.5 : 0.75 + i * 1.5), capB / 2, (z0 + z1) / 2, 'frame', ex);
    });
    sideY.forEach((y, i) => {
      if (turned && i === 0) return; // floor rail is laid flat above
      const behindPanel = sidePan && y >= panBottom - 0.3 && y + 3.5 <= panTop + 0.3;
      box(i === 0 ? 'Floor rail' : 'Side rail', 1.5, 3.5, Ls, (behindPanel ? xr : xo) + 0.75, y + 1.75, zF + Ls / 2, 'frame', i === 0 ? [sx * 10, -4, 0] : [sx * 7, 0, 0]);
    });
    box('Arm cap', 3.5, 1.5, zBk, side ? Wt - wT / 2 : wT / 2, capB + 0.75, zBk / 2, 'caps', [sx * 10, 7, 0]);
  }
  cut('Post' + (layers > 1 ? ' layer' : ''), capB, 4 * layers, layers > 1 ? 'square, glue and screw pairs face to face' : turned ? 'square, turned so the 3 1/2 in face runs side to side' : 'square', 'frontleg');
  if (turned) { cut('Side rail', Ls, 2 * (sideY.length - 1), 'square, on edge', 'seatrail'); cut('Floor rail', Ls, 2, 'square, laid flat', 'armrail'); }
  else cut('Side rail and floor rail', Ls, 2 * sideY.length, 'square, stop block', 'seatrail');
  cut('Arm cap', zBk, 2, 'square', 'armcap');
  if (layers > 1) screws.s25 += 4 * 6;
  screws.s3 += 2 * sideY.length * 4 + 2 * 4;

  // seat: apron flush with the deck, ledger behind it, back wall (its lowest board carries the deck)
  const zbw = rearPan ? zI - T : zI;
  box('Front apron', Wi, 3.5, 1.5, Wt / 2, deck - 1.75, 0.75, 'frame', [0, 0, -8]);
  box('Deck ledger', Wi, 3.5, 1.5, Wt / 2, sup - 1.75, 2.25, 'frame', [0, -3, -5]);
  const backRows = rearPan ? [backY[0], backY[backY.length - 1]] : backY;
  const bL = Wi;
  backRows.forEach(y => box(rearPan ? 'Back rail' : 'Back slat', bL, 3.5, 1.5, Wt / 2, y + 1.75, zbw + 0.75, 'frame', [0, 3, 10]));
  const bcL = Wi + wT - 3.5;
  if (capInside) { // laid flat against the front face of the top rail, top flush with the arm caps
    box('Back cap', bcL, 1.5, 3.5, Wt / 2, P.armH - 0.75, zbw - 1.75, 'caps', [0, 12, 10]);
  } else if (capBehind) { // laid flat against the back face of the top rail, top flush with the arm caps
    const railBack = zbw + 1.5;
    box('Back cap', bcL, 1.5, 3.5, Wt / 2, P.armH - 0.75, railBack + 1.75, 'caps', [0, 12, 10]);
    depth = Math.max(zBk, railBack + 3.5);
  } else box('Back cap', bcL, 1.5, 3.5, Wt / 2, capB + 0.75, zBk - 1.75, 'caps', [0, 12, 10]);
  if (bL === Wi) cut('Long rail (apron, ledger, back ' + (rearPan ? 'rails' : 'slats') + ')', Wi, 2 + backRows.length, 'square, stop block', 'longrail');
  else { cut('Apron and ledger', Wi, 2, 'square, glue and screw the ledger to the back of the apron', 'longrail'); cut('Back ' + (rearPan ? 'rail' : 'slat'), bL, backRows.length, 'square, stop block', 'topcap'); }
  cut('Back cap', bcL, 1, 'square', 'topcap');
  screws.s3 += (2 + backRows.length) * 4 + 4;
  const fullLd = round8(zbw);
  const Ld = (!ply && P.slatLen > 0) ? Math.min(round8(P.slatLen), fullLd) : fullLd;
  const shortSlats = Ld < fullLd - 0.25;
  if (shortSlats) { // a deck rail where the short slats end, on its own blocks
    const zr = 1.5 + Ld - 0.75;
    box('Deck rail', Wi, 3.5, 1.5, Wt / 2, sup - 1.75, zr, 'frame', [0, -3, 0]);
    [wT + 1.75, Wt - wT - 1.75].concat(Wi > 48 ? [Wt / 2] : []).forEach(x => box('Deck rail block', 3.5, y0, 1.5, x, y0 / 2, zr, 'frame', [0, -5, 0]));
    cut('Deck rail', Wi, 1, 'square, carries the back ends of the short slats', 'longrail');
    cut('Deck rail block', y0, Wi > 48 ? 3 : 2, 'square, under the deck rail ends and middle', 'centerleg');
    screws.s3 += 4 + (Wi > 48 ? 3 : 2) * 2;
  }
  let m = 0, gap = 0;
  if (ply) {
    box('Deck board', Wi, 0.75, Ld, Wt / 2, deck - 0.375, 1.5 + Ld / 2, 'frame', [0, 5, 0]);
    screws.s125 += 16;
  } else {
    const gT = clamp(P.slatGap, 0.5, 8);
    m = Math.max(3, Math.round((Wi + gT) / (3.5 + gT))); gap = (Wi - m * 3.5) / (m - 1);
    for (let i = 0; i < m; i++) box('Deck slat', 3.5, 1.5, Ld, wT + 1.75 + i * (3.5 + gap), deck - 0.75, 1.5 + Ld / 2, 'frame', [0, 5, 0]);
    cut('Deck slat', Ld, m, 'square, stop block', 'slat');
    screws.s25 += m * 4;
  }
  // seat blocks: short 2x4 legs under both ends of the ledger and the lowest back rail, so the seat load bears
  // straight down to the floor instead of hanging on screws driven into end grain

  const rollW = P.fabricW - 1;
  Object.values(groups).forEach(g => {
    const list = []; g.pieces.forEach(p => { for (let i = 0; i < p.qty; i++) list.push(p); });
    list.sort((a, b) => b.h - a.h);
    let y = 0, x = 0, shelfH = 0;
    list.forEach(p => {
      const w = p.w, h = p.h;
      if (x + w > rollW) { y += shelfH; x = 0; shelfH = 0; }
      x += w + 0.25; shelfH = Math.max(shelfH, h + 0.25);
    });
    y += shelfH;
    g.lengthIn = y;
    g.yards = ceilTo(y * 1.1 / 36, 0.25);
    g.count = list.length;
  });
  // bed nests per color for laser cutting fabric
  const bedItems = [];
  Object.values(groups).forEach(g => g.pieces.forEach(p => { for (let i = 0; i < p.qty; i++) bedItems.push({ w: p.w, h: p.h, key: g.hex, pc: p }); }));
  const bed = nest(bedItems, P.sheetW - 2 * MARGIN, P.sheetH - 2 * MARGIN, 0.2, true);
  // foam
  const out = P.climate === 'outdoor';
  const foam = types.map(([k, Dd, T]) => {
    const per = Math.max(Math.floor(24 / W) * Math.floor(72 / Dd), Math.floor(24 / Dd) * Math.floor(72 / W));
    return {
      kind: k, qty: 2 * n, w: W, d: Dd, t: T, perSheet: per, sheets: per ? Math.ceil(2 * n / per) : 2 * n,
      spec: out ? (k === 'seat' ? 'Reticulated dry fast open cell foam, 1.8 lb density, medium (about ILD 33 to 35)' : 'Reticulated dry fast open cell foam, soft (about ILD 25)')

    };
  });
  let dacronArea = 0; types.forEach(([k, Dd, T]) => { dacronArea += 2 * n * (W + 1) * (2 * Dd + 2 * T + 1); });
  const dacronYd = ceilTo(dacronArea * 1.1 / 54 / 36, 0.5);
  const zipYd = P.cushion === 'zip' ? ceilTo(types.reduce((a) => a + 2 * n * (W + 6), 0) * 1.05 / 36, 0.5) : 0;
  const cordYd = P.welt ? ceilTo(weltLen * 1.05 / 36, 0.5) : 0;
  const sewMin = (P.cushion === 'zip' ? 60 : 45) + (P.welt ? 20 : 0);
  const kitMatch = Object.keys(KIT).every(k => Math.abs(P[k] - KIT[k]) < 0.01);
  const sideN = MODEL && MODEL.S.sideN ? MODEL.S.sideN : 0; // per sofa
  const kit = P.cushSource === 'kit' ? { pieces: 4 * n + 2 * sideN, packs: Math.ceil((4 * n + 2 * sideN) / 2), match: kitMatch, side: 2 * sideN } : null;
  const nP = MODEL && MODEL.S.nCush ? MODEL.S.nCush : n;
  const pads = (P.cushSource === 'pad' || P.cushSource === 'pad2') ? { seats: 2 * nP * (P.cushSource === 'pad2' ? 2 : 1), backs: 2 * nP, side: 2 * sideN } : null;
  if (pads) pads.total = pads.seats + pads.backs + pads.side;
  return { groups: Object.values(groups), perType, bed, foam, dacronYd, zipYd, cordYd, sliders: P.cushion === 'zip' ? 4 * n : 0, sewMin, cushions: pads ? pads.total : 4 * n, weltLen, kit, pads };
}

/* paint: surface area per color, two coats */
function paintData() {
  const areas = {};
  const add = (k, a) => { if (k === 'floor') return; areas[k] = (areas[k] || 0) + a; };
  const partArea = p => {
    if (p.type === 'box') { const [a, b, c] = p.size; return 2 * (a * b + b * c + c * a); }
    let a = 0; p.shapes.forEach(s => { a += 2 * shapeArea(s) + (perimP(s.outer) + s.holes.reduce((q, h) => q + perimP(h), 0)) * p.depth; });
    return a;
  };
  MODEL.S.parts.forEach(p => add(p.mat, 2 * partArea(p)));
  MODEL.Tb.parts.forEach(p => add(p.mat, partArea(p)));
  const byHex = {};
  Object.keys(areas).forEach(k => {
    const hex = hexOf(k), e = byHex[hex] || (byHex[hex] = { hex, keys: [], ft2: 0 });
    e.keys.push(k); e.ft2 += areas[k] / 144;
  });
  return Object.values(byHex).map(e => {
    const need = e.ft2 * 2 / 350; // gallons, 2 coats at 350 sq ft per gallon
    e.wood = !!WOOD[e.hex];
    e.quarts = Math.max(1, Math.ceil(need * 4 * 1.15));
    e.label = e.ft2 < 6 ? '1 sample pot (8 oz)' : e.quarts >= 4 ? Math.ceil(e.quarts / 4) + ' gal' : e.quarts + ' qt';
    return e;
  }).sort((a, b) => b.ft2 - a.ft2);
}

/* build day: greedy list scheduling across the crew, one miter saw */
function scheduleData(lum, lz, fab) {
  const S = MODEL.S, tasks = [];
  const T = (id, name, dur, deps, tool, cat) => tasks.push({ id, name, dur: Math.round(dur), deps: deps || [], tool, cat });
  const perSofa = S.cuts.reduce((a, c) => a + c.qty, 0);

  ['A', 'B'].forEach(s => {

    T('side' + s, 'Side frames, sofa ' + s, 40, ['cut' + s], null, 'frame');
    T('box' + s, (S.box ? 'Apron and back wall, sofa ' : 'Seat box and back beams, sofa ') + s, 45 + S.beams * 5, ['side' + s], null, 'frame');
    T('slat' + s, 'Deck slats, sofa ' + s, 12 + S.m * 1.5, ['box' + s], null, 'frame');
    T('cap' + s, 'Arm caps and top cap, sofa ' + s, 20, ['box' + s], null, 'frame');
    const pd = [];
    if (P.sidePanels) { T('sp' + s, 'Side panels, sofa ' + s, 24 + (P.markSides ? 10 : 0), ['cap' + s], null, 'panel'); pd.push('sp' + s); }
    if (P.rearPanels) { T('rp' + s, 'Rear panels, sofa ' + s, 12 + rearN * 8 + (P.markRear ? 8 : 0), ['cap' + s], null, 'panel'); pd.push('rp' + s); }
    T('tu' + s, 'Touch up paint, sofa ' + s, 20, pd.length ? pd : ['cap' + s, 'slat' + s], null, 'finish');
    T('st' + s, 'Stuff cushions, sofa ' + s, P.n * 2 * 6, [], null, 'soft');
  });
  T('tbl', 'Table: slot the base together', 20, [], null, 'panel');
  T('tbt', 'Table: seat the top on the tabs', 15, ['tbl'], null, 'panel');
  T('set', 'Place, level, dress cushions', 20, ['tuA', 'tuB', 'stA', 'stB', 'tbt'], null, 'finish');
  const crew = clamp(P.crew | 0, 1, 6), free = new Array(crew).fill(0), done = {}, toolFree = { saw: 0 }, rows = Array.from({ length: crew }, () => []);
  const left = tasks.slice();
  while (left.length) {

  prep.push(['Laser cut all panels and table parts', lz.sheetCount + ' sheets of ' + P.sheetMM + ' mm plywood, roughly ' + Math.round(lz.sheetCount * 25 / 60 * 10) / 10 + ' h of bed time.', lz.sheetCount * 25]);

function computeDerived() {

const enc = new TextEncoder();

/* laser sheet: cut file, labelled map, DXF */
function sheetSVG(bin, idx, mode) {
  const W = P.sheetW * IN, H = P.sheetH * IN, mm = f => p => { const q = f(p); return [q[0] * IN, q[1] * IN]; };
  let body = '';
  if (mode === 'map') body += '<rect x="0" y="0" width="' + n2(W) + '" height="' + n2(H) + '" fill="#e3cc9e" stroke="#15120f" stroke-width="0.6"/>';
  bin.placed.forEach(pl => {
    const f = mm(placer(pl)), d = dPath(loopsOf(pl.it), f);
    if (mode === 'cut') body += '<path d="' + d + '" fill="none" stroke="#ff0000" stroke-width="0.1"/>';
    else {
      body += '<path d="' + d + '" fill="' + hexOf(pl.it.mat) + '" fill-rule="evenodd" stroke="#15120f" stroke-width="0.5"/>';
      const c = f([(pl.it.b.x0 + pl.it.b.x1) / 2, (pl.it.b.y0 + pl.it.b.y1) / 2]);
      const fs = Math.max(6, Math.min(16, Math.min(pl.it.w, pl.it.h) * IN / 7));
      body += '<text x="' + n2(c[0]) + '" y="' + n2(c[1]) + '" font-family="Arial,sans-serif" font-size="' + n2(fs) + '" text-anchor="middle" fill="#15120f" stroke="#faf6ec" stroke-width="' + n2(fs / 5) + '" paint-order="stroke">' + esc(pl.it.label) + '</text>';
    }
  });
  if (mode === 'map') body += '<text x="8" y="' + n2(H - 8) + '" font-family="Arial,sans-serif" font-size="12" fill="#15120f">GUSSET sheet ' + (idx + 1) + ', ' + P.sheetMM + ' mm, ' + P.sheetW + ' x ' + P.sheetH + ' in. Fill color = paint color.</text>';
  return '<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="' + n2(W) + 'mm" height="' + n2(H) + 'mm" viewBox="0 0 ' + n2(W) + ' ' + n2(H) + '">' + body + '</svg>\n';
}
function sheetDXF(bin) {
  const H = P.sheetH * IN, L = ['0', 'SECTION', '2', 'HEADER', '9', '$ACADVER', '1', 'AC1009', '9', '$INSUNITS', '70', '4', '0', 'ENDSEC', '0', 'SECTION', '2', 'ENTITIES'];
  bin.placed.forEach(pl => {
    const f = placer(pl);
    loopsOf(pl.it).forEach(loop => {
      L.push('0', 'POLYLINE', '8', 'CUT', '66', '1', '70', '1', '10', '0', '20', '0', '30', '0');
      loop.forEach(p => { const q = f(p); L.push('0', 'VERTEX', '8', 'CUT', '10', (q[0] * IN).toFixed(3), '20', (H - q[1] * IN).toFixed(3), '30', '0'); });
      L.push('0', 'SEQEND', '8', 'CUT');

function partsCSV() {

  D.lz.bins.forEach((b, i) => b.placed.forEach(pl => rows.push([pl.it.label, pl.it.group, swName(hexOf(pl.it.mat)), hexOf(pl.it.mat), n2(pl.it.w), n2(pl.it.h), Math.round(pl.it.w * IN), Math.round(pl.it.h * IN), i + 1, pl.it.note || ''])));

const CUTCOL = { frontleg: '#f2ab1e', backleg: '#f99a1c', seatrail: '#c2542c', armrail: '#5e93c4', armcap: '#9b7fd0', longrail: '#5fb892', slat: '#a79d8c', centerleg: '#d24f3a', topcap: '#756c5e' };
function boardsSVG(forUI) {
  const LL = lumSel(), maxL = Math.max(...LL.boards.map(b => b.len), 96), rowH = 26, W = forUI ? 560 : 820, sc = (W - 70) / maxL;
  let s = '', y = 8;
  LL.boards.forEach((b, i) => {
    s += '<text x="0" y="' + (y + 16) + '" font-family="IBM Plex Mono,monospace" font-size="12" fill="currentColor">' + (i + 1) + ' ' + b.len / 12 + "'</text>";
    s += '<rect x="60" y="' + y + '" width="' + n2(b.len * sc) + '" height="20" fill="none" stroke="currentColor" stroke-width="1.5"/>';
    let x = 60 + 0.25 * sc;
    b.pieces.forEach(p => {
      const w = p.len * sc;
      s += '<rect x="' + n2(x) + '" y="' + (y + 2) + '" width="' + n2(w) + '" height="16" fill="' + cutColorByName(p.name) + '" stroke="#15120f" stroke-width="1"><title>' + esc(p.name + ' ' + fin(p.len)) + '</title></rect>';
      if (w > 34) s += '<text x="' + n2(x + w / 2) + '" y="' + (y + 14) + '" font-family="IBM Plex Mono,monospace" font-size="10" text-anchor="middle" fill="#15120f">' + esc(fin(p.len)) + '</text>';
      x += w + KERF * sc;

    y += rowH;
  });
  const hgt = y + 4;
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + hgt + '"' + (forUI ? ' role="img" aria-label="Board cutting diagram"' : ' width="' + W + '" height="' + hgt + '" color="#15120f"') + '>' + s + '</svg>';
}

/* fabric patterns: 1:1 in inches, cut line, dashed seam line, notches, grain arrow */
function patternSVG(pc, colorHex, label) {
  const m = 1, W = pc.w + 2 * m, H = pc.h + 2 * m, sa = P.sa;
  let s = '<rect x="' + m + '" y="' + m + '" width="' + n2(pc.w) + '" height="' + n2(pc.h) + '" fill="' + (colorHex || 'none') + '" fill-opacity="0.18" stroke="#15120f" stroke-width="0.03"/>';
  s += '<rect x="' + n2(m + sa) + '" y="' + n2(m + sa) + '" width="' + n2(pc.w - 2 * sa) + '" height="' + n2(pc.h - 2 * sa) + '" fill="none" stroke="#15120f" stroke-width="0.02" stroke-dasharray="0.25 0.15"/>';
  if (pc.notch !== 'none') {
    const nt = (x, y, dx, dy) => '<path d="M' + n2(x - dy * 0.12) + ' ' + n2(y - dx * 0.12) + 'L' + n2(x + dx * 0.25) + ' ' + n2(y + dy * 0.25) + 'L' + n2(x + dy * 0.12) + ' ' + n2(y + dx * 0.12) + '" fill="none" stroke="#15120f" stroke-width="0.03"/>';
    s += nt(m + pc.w / 2, m, 0, 1) + nt(m + pc.w / 2, m + pc.h, 0, -1) + nt(m, m + pc.h / 2, 1, 0) + nt(m + pc.w, m + pc.h / 2, -1, 0);
  }
  const gx = m + pc.w * 0.2, gy0 = m + pc.h * 0.2, gy1 = m + pc.h * 0.8;
  if (pc.h > 3) s += '<path d="M' + n2(gx) + ' ' + n2(gy0) + 'V' + n2(gy1) + 'M' + n2(gx - 0.2) + ' ' + n2(gy0 + 0.35) + 'L' + n2(gx) + ' ' + n2(gy0) + 'L' + n2(gx + 0.2) + ' ' + n2(gy0 + 0.35) + 'M' + n2(gx - 0.2) + ' ' + n2(gy1 - 0.35) + 'L' + n2(gx) + ' ' + n2(gy1) + 'L' + n2(gx + 0.2) + ' ' + n2(gy1 - 0.35) + '" fill="none" stroke="#15120f" stroke-width="0.03"/>';
  const fs = Math.min(0.55, pc.h / 5, pc.w / 14);
  const tx = m + pc.w / 2, ty = m + pc.h / 2;
  s += '<text x="' + n2(tx) + '" y="' + n2(ty - fs * 0.2) + '" font-family="Arial,sans-serif" font-size="' + n2(fs) + '" text-anchor="middle" fill="#15120f">' + esc(label || pc.name) + '</text>';
  s += '<text x="' + n2(tx) + '" y="' + n2(ty + fs * 1.1) + '" font-family="Arial,sans-serif" font-size="' + n2(fs * 0.7) + '" text-anchor="middle" fill="#15120f">' + esc(fin(pc.w) + ' x ' + fin(pc.h) + ', cut ' + pc.qty + ', ' + P.sa + ' in seam allowance') + '</text>';
  return '<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="' + n2(W) + 'in" height="' + n2(H) + 'in" viewBox="0 0 ' + n2(W) + ' ' + n2(H) + '">' + s + '</svg>\n';
}
function fabricBedSVG(bin, idx) {
  const W = P.sheetW * IN, H = P.sheetH * IN;
  let s = '';
  bin.placed.forEach(pl => {
    const x = (MARGIN + pl.x) * IN, y = (MARGIN + pl.y) * IN, w = (pl.rot ? pl.it.h : pl.it.w) * IN, h = (pl.rot ? pl.it.w : pl.it.h) * IN;
    s += '<rect x="' + n2(x) + '" y="' + n2(y) + '" width="' + n2(w) + '" height="' + n2(h) + '" fill="none" stroke="#ff0000" stroke-width="0.1"/>';
    if (pl.it.pc.notch !== 'none') { // 6 mm slit notches at edge centers
      const nx = x + w / 2, ny = y + h / 2, k = 6;
      s += '<path d="M' + n2(nx) + ' ' + n2(y) + 'v' + k + 'M' + n2(nx) + ' ' + n2(y + h) + 'v-' + k + 'M' + n2(x) + ' ' + n2(ny) + 'h' + k + 'M' + n2(x + w) + ' ' + n2(ny) + 'h-' + k + '" fill="none" stroke="#ff0000" stroke-width="0.1"/>';
    }
    s += '<text x="' + n2(x + w / 2) + '" y="' + n2(y + h / 2) + '" font-family="Arial,sans-serif" font-size="' + n2(Math.min(10, h / 2.5)) + '" text-anchor="middle" fill="#0000ff">' + esc(pl.it.pc.name) + '</text>';
  });
  return '<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="' + n2(W) + 'mm" height="' + n2(H) + 'mm" viewBox="0 0 ' + n2(W) + ' ' + n2(H) + '"><!-- red = cut, blue text = label only, set to engrave off -->' + s + '</svg>\n';
}
function foamTXT() {

function fabricFiles(prefix) {
  const f = [], fab = D.fab, rows = [['piece', 'color', 'hex', 'width_in', 'height_in', 'qty', 'note']];
  fab.groups.forEach(g => g.pieces.forEach(p => rows.push([p.name, swName(g.hex), g.hex, n2(p.w), n2(p.h), p.qty, p.note])));
  f.push({ name: prefix + 'pieces.csv', data: rows.map(csvRow).join('\n') + '\n' });
  const seen = {};
  fab.groups.forEach(g => g.pieces.forEach(p => { const fn = p.name.toLowerCase().replace(/[^a-z0-9]+/g, '-'); if (seen[fn]) return; seen[fn] = 1; f.push({ name: prefix + 'patterns/' + fn + '.svg', data: patternSVG(Object.assign({}, p, { qty: fab.perType[p.kind] ? (fab.perType[p.kind].find(q => q.name === p.name) || p).qty : p.qty }), null, p.name) }); }));
  if (FABRICS[P.fabric].laser !== 'no') {
    const counts = {};
    fab.bed.bins.forEach(b => { const nm = swName(b.key).toLowerCase().replace(/[^a-z0-9]+/g, '-'); counts[nm] = (counts[nm] || 0) + 1; f.push({ name: prefix + 'laser-bed/' + nm + '-' + String(counts[nm]).padStart(2, '0') + '.svg', data: fabricBedSVG(b) }); });

function sewingSteps() {
  const z = P.cushion === 'zip', w = P.welt, s = [];
  if (w) s.push('Welt: join the 1 1/2 in strips end to end, fold over the cord and baste close with a zipper foot. Make one loop per plate edge.');
  if (z) {
    s.push('Zipper plaque: lay the two plaque halves face to face, baste them together along the long edge, press open, sew the zipper face down over the seam, then open the basting.');
    s.push('Band: sew side, front, side into one strip, then sew the plaque ends to the free side ends so the band closes into a ring. Plaque centered on the back.');
  } else {
    s.push('Bottom halves: fold the straight edge 1/2 in twice and topstitch. Overlap the two halves 5 in and baste the overlap at the sides so it acts as one plate.');
    s.push('Band: sew long, short, long, short into a ring.');
  }
  s.push((w ? 'Baste the welt to the top plate with the cord inward, clipping the welt allowance at the corners. ' : '') + 'Pin the band to the top plate face to face, matching the notches to the band centers and seams to the corners. Sew all the way around.');
  s.push('Repeat on the bottom plate' + (z ? ' with the zipper open.' : '.') + ' Clip the corners, turn right side out, push the corners square.');
  s.push('Wrap the foam in dacron, fold it in half like a taco, slide it in, and let it open. Work the corners out with your fist.');
  return s;
}

function frameSteps() {
  const S = MODEL.S, s = [];

    s.push('Cut everything square with a stop block. There are no angled cuts in the box frame.');
    if (S.turned) s.push('Posts: all four legs are single 2x4s turned so the 3 1/2 in face runs side to side, and the floor rail between them lies flat, like the reference build.');
    else if (S.wT > 1.5) s.push('Posts: glue and screw two post layers face to face with 2 1/2 in screws. Four posts per sofa.');
    s.push('Side frames: lay a front and back post flat, ' + fin(S.footLen) + ' apart. ' + (S.turned ? 'Lay the floor rail flat between the leg bottoms, flush with their outside faces, then add' : 'Screw the floor rail flush with the floor end and') + ' the seat rail with its top at ' + fin(S.deck - (S.ply ? 0.75 : 1.5)) + (S.lower ? '. Leave the arm open above it so feet fit through' : (P.sidePanels ? ', plus a top rail under the cap' : ', then ' + (S.slats - 1) + ' more slats up to the cap, ' + fin(S.gap) + ' gaps')) + (P.sidePanels ? '. Rails behind the panel step in ' + P.sheetMM + ' mm' : '') + '. 3 in screws, two per joint. Make a mirrored pair.');
    s.push('Stand the sides up and join them with the front apron (top flush with the deck) and the deck ledger right behind it at the front posts and the ' + (P.rearPanels ? 'back rails' : 'back slats') + ' at the back posts, lowest board tops at ' + fin(S.deck - 1.5) + ' so they carry the deck.');
    if (P.blocks) s.push('Seat blocks: stand a block under each end of the ledger and of the lowest back rail, tight to the floor. Glue and screw the back pair to the back posts. Now the seat bears on wood, not on screws.');
    if (S.shortSlats) s.push('Short slats: screw the deck rail on edge across the seat with its back face ' + fin(S.slatLen + 1.5) + ' from the front of the apron, top flush with the ledger, standing on its blocks.');
    s.push(S.ply ? 'Drop the 3/4 in plywood deck in behind the apron onto the ledger and the lowest back board, 1 1/4 in screws every 6 in.' : 'Deck slats front to back from behind the apron, resting on the ledger and the lowest back board, 2 1/2 in screws, ' + fin(S.deckGap) + ' gaps.');
    s.push('Arm caps flat on each side, flush front and back. ' + (S.capInside ? 'Back cap laid flat against the inside face of the top back rail, tops flush, glued and screwed through the rail every 8 in.' : S.capBehind ? 'Back cap laid flat against the back of the top back rail, tops flush, glued and screwed through the rail every 8 in. It hangs ' + fin(S.capOut) + ' out the back.' : 'Back cap flat on top of the back wall between the arm caps.'));
    if (P.sidePanels) s.push('Screw each side panel between the posts ' + (S.lower ? 'below the seat, ' : '') + 'into the rails with 1 1/4 in pan heads. Glue it too: the panel is what keeps the side from racking.');
    if (P.rearPanels) s.push('Screw the rear panel to the back rails and back posts, battens behind any seam.');
    if ((P.sidePanels && P.markSides) || (P.rearPanels && P.markRear)) s.push('Mark appliques: glue the sun disc on first, then the flames and arrow over it.');
    return s;
  }
  s.push('Cut everything on the list with a stop block on the miter saw so repeated parts match. The back legs are parallelograms: cut both ends at ' + P.recline + ' degrees, parallel.');
  s.push('Side frames: lay the front leg and back leg on the bench outer face down. Screw the seat rail and arm rail across them on the inside face, rail tops at ' + fin(S.deck - 5) + ' and ' + fin(S.yA1) + ' from the floor. Two 3 in screws per joint. Make a mirrored pair.');
  s.push('Stand both sides up and join them with the front and back seat rails and the back beams (all the same long rail length), 3 in screws through the legs.');
  s.push('Screw the deck slats flat across the seat rails, 2 1/2 in screws, spaced evenly. Use a scrap as a spacer.');

function snapshotPNG() {

  for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);

}

      '<tr><td>Outdoor cushion covers 22 x 20 x 4 in, zippered, 2-pack<div style="font-size:12.5px;color:var(--smoke)">Magpie Fabrics, Nettypro or Cinnamonee. Pick the colors closest to your seat and back picks</div></td><td class="n">' + F.kit.packs + '</td><td class="n">' + money(P.priceCoverPack) + '</td></tr>' +
      '<tr><td>Total</td><td></td><td class="n">' + money(F.kit.pieces * P.priceKitFoam + F.kit.packs * P.priceCoverPack) + '</td></tr></tbody></table></div>';
    h += '<div class="grid2">' + num('priceKitFoam', 'Foam piece $') + num('priceCoverPack', 'Cover 2-pack $') + '</div>';
    h += '<ol class="steps"><li>Unbox the foam and let it recover flat, 24 to 72 hours.</li><li>Fold each piece like a taco, slide it into the cover, let it open, work the corners out.</li><li>Seats go zipper to the back. Backs stand on the 22 in edge, zipper down.</li></ol>';
    h += '<p class="lead">On Amazon, filter results by Get It Tomorrow to see which listings ship overnight to you.</p>';
    return h;
  }
  h += '<h2>Covers</h2><div class="grid2">' + sel('cushion', 'Closure', [['zip', 'Zipper box'], ['envelope', 'Envelope, no zipper']]) + sel('fabric', 'Fabric', Object.keys(FABRICS).map(k => [k, FABRICS[k].name.split(' (')[0]])) + sel('climate', 'Where', [['indoor', 'Indoors'], ['outdoor', 'Outdoors']]) + sel('fabricW', 'Roll width', [[54, '54 in'], [60, '60 in'], [45, '45 in']]) + '</div>';
  h += '<div class="checks">' + chk('welt', 'Contrast piping (welt) on both edges') + '</div>';
  h += fb.laser === 'no' ? '<div class="warn">' + ICON.warn + ' ' + esc(fb.note) + '</div>' : '<div class="note">Laser: ' + (fb.laser === 'yes' ? 'yes. ' : 'test first. ') + esc(fb.note) + '</div>';
  h += '<p class="lead">' + (P.cushion === 'zip' ? 'Box cushion with a zipper plaque across the back and 3 in around each corner, so the covers come off to wash.' : 'Envelope back: the bottom is two overlapping hemmed halves. No zipper to install, still removable.') + ' ' + P.sa + ' in seam allowance on every edge.</p>';
  h += '<h3>One seat cushion</h3><div class="svgbox">' + patternPreview() + '</div>';
  h += '<h2>Fabric by color</h2><div class="scrollx"><table><thead><tr><th>Color</th><th>Used on</th><th class="n">Pieces</th><th class="n">Yards</th></tr></thead><tbody>' +
    F.groups.map(g => '<tr><td><span class="chip" style="display:inline-block;width:14px;height:14px;border-width:1px;box-shadow:none;vertical-align:-2px;background:' + g.hex + '"></span> ' + esc(swName(g.hex)) + '</td><td>' + esc(Array.from(g.keys).map(k => (TARGETS.find(t => t[0] === k) || [0, k])[1].replace(' cushions', '')).join(', ')) + '</td><td class="n">' + g.count + '</td><td class="n">' + g.yards + '</td></tr>').join('') + '</tbody></table></div>';
  if (fb.laser !== 'no') h += '<p>Laser bed nests: ' + F.bed.bins.length + ' fabric loads' + (F.bed.oversize.length ? ', ' + F.bed.oversize.length + ' pieces bigger than the bed get cut by hand from the 1:1 pattern' : '') + '.</p>';
  h += '<h2>Foam</h2><p class="lead">Cut each piece the same size as the finished cushion. The dacron wrap gives the crown. Order it cut to size, or carve slabs with an electric carving knife. Never on the laser.</p><div class="scrollx"><table><thead><tr><th>Piece</th><th class="n">Size</th><th class="n">Qty</th></tr></thead><tbody>' +
    F.foam.map(f => '<tr><td>' + (f.kind === 'seat' ? 'Seat' : 'Back') + '<div style="font-size:12.5px;color:var(--smoke)">' + esc(f.spec) + '</div></td><td class="n">' + fin(f.w) + ' x ' + fin(f.d) + ' x ' + fin(f.t) + '</td><td class="n">' + f.qty + '</td></tr>').join('') + '</tbody></table></div>';
  h += '<p>Plus ' + F.dacronYd + ' yd of 1 oz dacron' + (F.zipYd ? ', ' + F.zipYd + ' yd of #5 zipper chain and ' + F.sliders + ' sliders' : '') + (F.cordYd ? ', ' + F.cordYd + ' yd of 5/32 in welt cord' : '') + '.</p>';
  h += '<h2>Sewing</h2><ol class="steps">' + sewingSteps().map(s => '<li>' + esc(s) + '</li>').join('') + '</ol>';
  h += '<p class="lead">About ' + F.sewMin + ' min per cover, ' + F.cushions + ' covers. This is the long pole: sew them before build day.</p>';
  h += '<div class="dl"><button class="btn primary" data-act="dlFabric">' + ICON.dl + 'Pattern pack</button></div>';
  return h;
}

function gantt() {
  const s = D.sch, W = 560, lab = 62, rowH = 30, span = Math.ceil(s.total / 60) * 60 || 60, sc = (W - lab - 10) / span;
  const CAT = { cut: '#f99a1c', frame: '#f2ab1e', panel: '#5e93c4', finish: '#a79d8c', soft: '#c2542c' };
  let g = '';
  for (let m = 0; m <= span; m += 60) { const x = lab + m * sc, hr = P.start + m / 60; g += '<line x1="' + n2(x) + '" y1="0" x2="' + n2(x) + '" y2="' + (s.crew * rowH + 6) + '" stroke="currentColor" stroke-opacity=".25"/><text x="' + n2(x) + '" y="' + (s.crew * rowH + 20) + '" font-size="11" text-anchor="middle" fill="currentColor" font-family="IBM Plex Mono,monospace">' + (((Math.floor(hr) + 11) % 12) + 1) + (hr < 12 ? 'a' : 'p') + '</text>'; }
  s.rows.forEach((r, i) => {
    g += '<text x="0" y="' + (i * rowH + 19) + '" font-size="12" fill="currentColor" font-family="Instrument Sans,sans-serif">Person ' + (i + 1) + '</text>';
    r.forEach(t => { const x = lab + t.st * sc, w = Math.max(2, (t.en - t.st) * sc - 1); g += '<rect x="' + n2(x) + '" y="' + (i * rowH + 4) + '" width="' + n2(w) + '" height="' + (rowH - 8) + '" fill="' + CAT[t.cat] + '" stroke="#15120f"><title>' + esc(t.name + ', ' + t.dur + ' min') + '</title></rect>'; if (w > 60) g += '<text x="' + n2(x + 4) + '" y="' + (i * rowH + 19) + '" font-size="10" fill="#15120f" font-family="Instrument Sans,sans-serif">' + esc(t.name.replace(/, sofa /, ' ').slice(0, Math.floor(w / 5.6))) + '</text>'; });
  });
  return '<svg viewBox="0 0 ' + W + ' ' + (s.crew * rowH + 26) + '" role="img" aria-label="Build day schedule">' + g + '</svg>';
}
function paneBuild() {
  const s = D.sch, hm = m => { const t = P.start * 60 + m, h = Math.floor(t / 60); return ((h + 11) % 12 + 1) + ':' + String(Math.round(t % 60)).padStart(2, '0') + (h < 12 ? ' am' : ' pm'); };
  let h = '<h2>Before the day</h2><ol class="steps">' + s.prep.map(p => '<li>' + esc(p[0]) + '. <span style="color:var(--ash)">' + esc(p[1]) + '</span></li>').join('') + '</ol>';
  h += '<h2>Build day</h2><div class="grid2">' + field('crew', 'Crew', 1, 6, 1, v => v + (v > 1 ? ' people' : ' person')) + field('start', 'Start', 6, 13, 0.5, v => hm(0)) + '</div>';
  h += '<p>Frames, panels, table and cushions done by about <span class="ok">' + hm(s.total) + '</span>, ' + Math.round(s.total / 6) / 10 + ' h. One miter saw, so cutting is the first bottleneck.</p>';
  h += '<div class="svgbox" style="color:var(--ink);padding:8px">' + gantt() + '</div>';
  h += '<h2>Paint</h2><div class="scrollx"><table><thead><tr><th>Color</th><th>On</th><th class="n">Area</th><th class="n">Buy</th></tr></thead><tbody>' + D.paint.map(p => '<tr><td><span class="chip" style="display:inline-block;width:14px;height:14px;border-width:1px;box-shadow:none;vertical-align:-2px;background:' + p.hex + '"></span> ' + esc(p.wood ? 'Clear coat' : swName(p.hex)) + '</td><td>' + esc(p.keys.map(k => (TARGETS.find(t => t[0] === k) || [0, k])[1]).join(', ')) + '</td><td class="n">' + Math.round(p.ft2) + ' ft²</td><td class="n">' + esc(p.label) + '</td></tr>').join('') + '</tbody></table></div>';
  h += '<p class="lead">Two coats at 350 ft² per gallon, both faces of panels and table parts.</p>';
  const rows = shoppingRows(); let tot = 0; rows.forEach(r => { tot += r.total; });
  h += '<h2>Shopping list</h2><div class="scrollx"><table><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Est</th></tr></thead><tbody>' + rows.map(r => '<tr><td>' + esc(r.item) + '</td><td class="n">' + esc(r.qty + ' ' + r.unit) + '</td><td class="n">' + money(r.total) + '</td></tr>').join('') + '<tr><td>Total</td><td></td><td class="n">' + money(tot) + '</td></tr></tbody></table></div>';
  h += '<h3>Prices</h3><div class="grid2">' + num('priceBoard', '8 ft 2x4 $') + num('priceSheet', 'Ply sheet $') + num('priceYard', 'Fabric yd $') + num('priceQuart', 'Paint qt $') + num('priceFoamSeat', 'Seat foam $') + num('priceFoamBack', 'Back foam $') + '</div>';
  h += '<div class="dl"><button class="btn primary" data-act="dlPlan">' + ICON.dl + 'Build plan</button><button class="btn" data-act="dlShop">' + ICON.dl + 'Shopping CSV</button></div>';
  return h;
}

const PANES = { shape: paneShape, color: paneColor, lumber: paneLumber, laser: paneLaser, cushions: paneCushions, build: paneBuild };
function renderPane() {
  const pane = $('#pane'), st = pane.scrollTop;
  try { pane.innerHTML = PANES[TAB](); } catch (e) { console.error(e); pane.innerHTML = '<div class="warn">This tab hit an error: ' + esc(e.message) + '</div>'; }
  pane.scrollTop = st;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === TAB));
}
function renderStats() {
  const S = MODEL.S, fab = D.fab, yd = fab.groups.reduce((a, g) => a + g.yards, 0);
  const rf = roomFit(); const st = [[ftin(rf.Z) + ' x ' + ftin(rf.X), rf.ok ? 'fits the ' + ftin(P.roomL) + ' x ' + ftin(P.roomW) + ' room' : 'too big for the room'], [fin(S.deck + (S.cushSeatT || P.seatT)), 'seat height'], [D.lum.boards.length, '2x4 boards'], [D.lz.sheetCount, 'ply sheets'], (fab.kit ? [fab.kit.pieces, 'kit cushions'] : fab.pads ? [fab.pads.total, '18 in pads'] : [yd + ' yd', 'fabric']), [Math.round(D.sch.total / 6) / 10 + ' h', 'build, crew ' + D.sch.crew]];
  $('#stats').innerHTML = st.map(s => '<div class="stat"><b>' + esc(s[0]) + '</b><span>' + esc(s[1]) + '</span></div>').join('');
  const Tb = MODEL.Tb;
  const pl = R && R.showPeople ? (R.lieInfo && R.lieInfo.through ? '<div>Lying ' + R.lieInfo.label + ': ' + fin(R.lieInfo.over) + ' over the calves</div>' : '') + (R.kneeInfo ? '<div>Knee room to table ' + fin(P.legroom + R.kneeInfo.z) + '</div>' : '') : '';
  $('#hud').innerHTML = pl + '<div>Sofa ' + fin(S.Wt) + ' W x ' + fin(S.depth) + ' D x ' + fin(S.height) + ' H</div><div>Seat ' + fin(S.deck + (S.cushSeatT || P.seatT)) + ', arm ' + fin(P.armH) + (S.box ? (S.lower ? ', foot opening ' + fin(S.footGap) : ', box frame') : ', recline ' + P.recline + '°') + '</div><div>Table ' + fin(Tb.L) + ' x ' + fin(Tb.D) + ' x ' + fin(Tb.H) + ', legroom ' + fin(P.legroom) + '</div>';
}

function persist() { try { localStorage.setItem('gusset:v16', JSON.stringify({ P, C, TAB })); } catch (e) { } }
function restore() {
  try {
    const s = JSON.parse(localStorage.getItem('gusset:v16') || 'null'); if (!s) return;
    Object.keys(DEF).forEach(k => { if (s.P && k in s.P && typeof s.P[k] === typeof DEF[k]) P[k] = s.P[k]; });
    Object.keys(C).forEach(k => { if (s.C && /^#[0-9a-f]{6}$/i.test(s.C[k] || '')) C[k] = s.C[k].toLowerCase(); });
    if (s.TAB && PANES[s.TAB]) TAB = s.TAB;
  } catch (e) { }
}
function sanitize() {
  P.tL = Math.min(P.tL, P.sheetW - 2 * MARGIN - 0.25); P.tD = Math.min(P.tD, P.sheetH - 2 * MARGIN - 0.25);
  if (P.style !== 'box' && P.backTop < P.armH + 4) P.backTop = P.armH + 4;
  if (P.armH < P.deckH + 6) P.armH = P.deckH + 6;
}
function update(full) {
  sanitize();
  rebuild(); computeDerived(); renderStats();
  if (R) $('#tPan').setAttribute('aria-pressed', (P.sidePanels || P.rearPanels) && R.showPan ? 'true' : 'false');
  if (full || (TAB !== 'shape' && TAB !== 'color')) renderPane();
  else if (TAB === 'shape') { const w = $('#pane'); const old = w.querySelectorAll('.warn'); old.forEach(n => n.remove()); w.insertAdjacentHTML('beforeend', shapeWarnings()); }
  persist();
}
const schedule = full => { clearTimeout(rebuildT); rebuildT = setTimeout(() => update(full), 90); };
function colorsChanged() {
  refreshColors(); computeDerived(); renderStats(); persist();
}

function wire() {
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (!b) return; TAB = b.dataset.tab; OPEN = null; renderPane(); $('#pane').scrollTop = 0; persist(); });
  $('#tabs').addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const tabs = [...document.querySelectorAll('#tabs button')], i = tabs.findIndex(b => b.dataset.tab === TAB), j = (i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length;
    TAB = tabs[j].dataset.tab; renderPane(); tabs[j].focus(); persist();
  });
  const pane = $('#pane');
  pane.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.color) { C[t.dataset.color] = t.value.toLowerCase(); const row = t.closest('.colorrow'); row.querySelector('.chip').style.background = t.value; row.querySelectorAll('.sw').forEach(s => s.setAttribute('aria-pressed', 'false')); colorsChanged(); return; }
    const k = t.dataset.p; if (!k || t.type === 'checkbox' || t.tagName === 'SELECT') return;
    const v = parseFloat(t.value); if (!isFinite(v)) return;
    P[k] = v;
    const o = $('#o_' + k); if (o) { const f = SHAPE.flatMap(s => s[1]).find(f => f[0] === k), xf = { slatGap: fin, roomL: ftin, roomW: ftin }[k]; o.textContent = f ? f[5](v) : xf ? xf(v) : (k === 'crew' ? v + (v > 1 ? ' people' : ' person') : o.textContent); }
    if (k === 'start') { const h = Math.floor(v), m = Math.round((v - h) * 60); o.textContent = ((h + 11) % 12 + 1) + ':' + String(m).padStart(2, '0') + (h < 12 ? ' am' : ' pm'); }
    if (TAB === 'build' && t.type === 'range') return;
    if (t.type === 'number') { computeDerived(); renderStats(); persist(); clearTimeout(pane.nt); pane.nt = setTimeout(renderPane, 600); return; }
    schedule(false);
  });
  pane.addEventListener('change', e => {
    const t = e.target, k = t.dataset.p; if (!k) { if (t.dataset.color) renderPane(); return; }
    if (t.type === 'checkbox') P[k] = t.checked;
    else if (t.tagName === 'SELECT') P[k] = typeof DEF[k] === 'number' ? parseFloat(t.value) : t.value;
    else if (t.type === 'range') { clearTimeout(rebuildT); update(true); return; }
    else return;
    if (k === 'cutColors' && R) { R.showCush = !P.cutColors; $('#tCush').setAttribute('aria-pressed', R.showCush); }
    if (k === 'fabric') { Object.keys(MATS).forEach(applyColor); }
    if (k === 'climate' && P.climate === 'outdoor' && P.fabric === 'poly') { P.fabric = 'acrylic'; toast('Switched fabric to outdoor acrylic canvas'); }
    update(true);
  });
  pane.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const a = b.dataset.act;
    if (a === 'open') { OPEN = OPEN === b.dataset.v ? null : b.dataset.v; renderPane(); const nb = pane.querySelector('[data-act="open"][data-v="' + b.dataset.v + '"]'); if (nb) nb.focus(); }
    else if (a === 'sw') { C[b.dataset.k] = b.dataset.v; renderPane(); const nb = pane.querySelector('.sw[data-k="' + b.dataset.k + '"][data-v="' + b.dataset.v + '"]'); if (nb) nb.focus(); colorsChanged(); }
    else if (a === 'fit') {
      const S = MODEL.S, lr = Math.floor(((P.roomL - 2 * S.depth - P.tD) / 2) * 2) / 2;
      if (lr < 10) { toast('Not enough length. Shrink the seat depth or table width first'); return; }
      P.legroom = Math.min(24, lr); update(true); toast('Legroom set to ' + fin(P.legroom));
    }
    else if (a === 'scope') { P.lumberScope = b.dataset.v; persist(); renderPane(); }
    else if (a === 'kitSize') { Object.assign(P, KIT); update(true); toast('Cushions set to 22 x 20 x 4 in'); }
    else if (a === 'preset') { Object.assign(C, PRESETS[b.dataset.v]); colorsChanged(); renderPane(); toast('Preset: ' + b.dataset.v); }
    else if (a === 'dlCut') saveFile(P.lumberScope === 'one' ? 'gusset-cutlist-one-couch.csv' : 'gusset-cutlist.csv', cutlistCSV());
    else if (a === 'dlBoards') saveFile('gusset-boards.svg', '<?xml version="1.0" encoding="UTF-8"?>\n' + boardsSVG(false));
    else if (a === 'dlLaser') saveFile('gusset-laser.zip', makeZip(laserFiles('gusset-laser/')));
    else if (a === 'dlFabric') saveFile('gusset-patterns.zip', makeZip(fabricFiles('gusset-patterns/')));
    else if (a === 'dlPlan') saveFile('gusset-build-plan.md', buildPlanMD());
    else if (a === 'dlShop') saveFile('gusset-shopping-list.csv', shoppingCSV());
  });
  $('#dlAll').addEventListener('click', () => saveFile('gusset-build-pack.zip', buildPack()));
  $('#snap').addEventListener('click', () => { const u = snapshotPNG(); if (u) saveFile('gusset-' + (R.view || 'view') + '.png', u); });
  $('#views').addEventListener('click', e => { const b = e.target.closest('button[data-view]'); if (b) setView(b.dataset.view); });
  $('#explode').addEventListener('input', e => { if (R) { R.explode = parseFloat(e.target.value); applyVisibility(); } });
  $('#tCush').addEventListener('click', e => { R.showCush = !R.showCush; e.currentTarget.setAttribute('aria-pressed', R.showCush); applyVisibility(); });
  $('#tPeople').addEventListener('click', e => { R.showPeople = !R.showPeople; e.currentTarget.setAttribute('aria-pressed', R.showPeople); if (R.showPeople && R.explode > 0.05) { R.explode = 0; $('#explode').value = 0; } applyVisibility(); renderStats(); });
  $('#tPan').addEventListener('click', e => {
    const btn = e.currentTarget;
    if (!P.sidePanels && !P.rearPanels) { // nothing to show yet: turn the panels on instead of toggling an empty layer
      P.sidePanels = true; P.rearPanels = true; R.showPan = true; update(true); applyVisibility();
      btn.setAttribute('aria-pressed', 'true'); toast('Side and rear panels on'); return;
    }
    R.showPan = !R.showPan; btn.setAttribute('aria-pressed', R.showPan); applyVisibility();
  });
  $('#themeBtn').addEventListener('click', () => {
    const root = document.documentElement, cur = root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    root.dataset.theme = cur === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('gusset:theme', root.dataset.theme); } catch (e) { }
    refreshColors();
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', refreshColors);
}

function boot() {
  try { const t = localStorage.getItem('gusset:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { }
  if (!window.THREE || !THREE.OrbitControls || !THREE.SVGLoader) { $('#loading').textContent = 'The 3D engine (three.js) did not load. Check the network and reload.'; return; }
  restore(); sanitize(); wire();
  try { initScene(); } catch (e) { console.error(e); $('#loading').textContent = 'WebGL is not available in this browser, so the 3D view is off. Every tab and export still works.'; R = null; }
  rebuild(); computeDerived(); renderStats(); renderPane(); refreshColors();
  if (R) { setView('lounge', true); $('#loading').style.display = 'none'; }
  downloadsCap();
}
boot();

</script>
