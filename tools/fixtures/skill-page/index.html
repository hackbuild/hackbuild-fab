<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skill page</title>
<link rel="icon" href="data:,">
<!-- A bench page the way the hack fab skill writes one: the libraries from a release, the chase and the build inline.
     tools/smoke/skill-page.spec.ts serves these urls from this checkout. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/hackbuild/hackbuild-fab@lib-v0.2.0/tools/vendor/hackbuild-ui/hackbuild.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/hackbuild/hackbuild-fab@lib-v0.2.0/packages/bench/dist/style.css">
<script type="importmap">
{
  "imports": {
    "vue": "https://cdn.jsdelivr.net/npm/vue@3.5.43/dist/vue.esm-browser.prod.js",
    "pinia": "https://cdn.jsdelivr.net/npm/pinia@4.0.3/dist/pinia.esm-browser.js",
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "nostics": "https://cdn.jsdelivr.net/npm/nostics@1.3.0/dist/index.mjs",
    "@vue/devtools-api": "https://cdn.jsdelivr.net/npm/@vue/devtools-api@8.2.1/dist/vue-devtools-api.esm-browser.js",
    "manifold-3d": "https://cdn.jsdelivr.net/npm/manifold-3d@3.5.4/manifold.js",
    "@hackbuild/spec": "https://cdn.jsdelivr.net/gh/hackbuild/hackbuild-fab@lib-v0.2.0/spec/dist/cdn/spec.js",
    "@hackbuild/engine": "https://cdn.jsdelivr.net/gh/hackbuild/hackbuild-fab@lib-v0.2.0/packages/engine/dist/cdn/engine.js",
    "@hackbuild/viewer": "https://cdn.jsdelivr.net/gh/hackbuild/hackbuild-fab@lib-v0.2.0/packages/viewer/dist/cdn/viewer.js",
    "@hackbuild/bench-core": "https://cdn.jsdelivr.net/gh/hackbuild/hackbuild-fab@lib-v0.2.0/packages/bench-core/dist/cdn/bench-core.js",
    "@hackbuild/bench": "https://cdn.jsdelivr.net/gh/hackbuild/hackbuild-fab@lib-v0.2.0/packages/bench/dist/cdn/bench.js"
  }
}
</script>
</head>
<body class="hb">
<div id="app"></div>
<script type="module" data-hbf-page>
import { canonicalize, commandError, defineBench, defineBuild, defineChase, sha256Hex } from "@hackbuild/spec";
import { createPageBuild, factsFor } from "@hackbuild/engine";
import { createBench, pageBench } from "@hackbuild/bench";

// ---- chase: declarations only
// reference/cosmetic/art-layers/chase.ts
// The reference for the layer kinds BAIL adds to the inlay kind (plan v11
// section 4.3 step a): shape in all 13 kinds, scope, circuit, logo, and text
// with letter spacing and an arc. One blank plate, 100 by 64 mm and 3.61 mm
// thick, on the ffc5p 0.24 mm preset, in a black body (slot 1) with two art
// slots, pink (2) and cream (3), the slots of cosmetic/coin-inlay. The front
// face carries the 13 shapes in three rows, then the scope trace, a seeded
// circuit and the hack.build mark, then a line of text; the back face
// carries two arcs, spaced text and an arrow. Inlay depth 1.2 mm is 5
// layers of 0.24 mm (computed). A chase declares and never computes (D-178);
// the layers and the content address are in build.ts.

const chase = defineChase({
  meta: {
    id: "art-layers", kind: "single", name: "ART LAYERS", version: 1, chase: 2,
    kernels: ["geom", "mesh", "inlay", "3mf"], machines: ["ffc5p"],
    license: "CC-BY-SA-4.0",
  },
  materials: [
    { slot: 1, material: "petg", role: "body", label: "black", preview: "#1A1A1A" },
    { slot: 2, material: "petg", role: "art", label: "pink", preview: "#FE0386" },
    { slot: 3, material: "petg", role: "art", label: "cream", preview: "#F5F0E6" },
  ],
  params: [
    { id: "blank", label: "BLANK", live: "commit", fields: [
      { id: "w", type: "mm", label: "width", range: [96, 120], step: 2, default: 100,
        help: "six columns of shapes, 16 mm apart at the default" },
      { id: "h", type: "mm", label: "height", range: [60, 80], step: 2, default: 64,
        help: "three rows, 20 mm apart" },
      { id: "thk", type: "mm", label: "thickness", range: [2.41, 6.01], step: 0.24, default: 3.61,
        help: "a layer top: the 0.25 mm first layer plus whole 0.24 mm layers" },
    ] },
    { id: "inlay", label: "INLAY", live: "commit", fields: [
      { id: "depth", type: "mm", label: "colour depth", range: [0.48, 1.68], step: 0.24, default: 1.2,
        help: "a whole number of layers; light over dark needs 1.2" },
      { id: "minF", type: "mm", label: "min feature", range: [0.6, 2], step: 0.05, default: 0.6 },
      { id: "boost", type: "mm", label: "stroke boost", range: [0, 0.5], step: 0.05, default: 0.15 },
      { id: "gap", type: "mm", label: "colour gap", range: [0, 1], step: 0.05, default: 0 },
      { id: "cells", type: "int", label: "grid", range: [4, 12], step: 1, default: 8, quality: true,
        help: "cells per mm; 8 is BAIL's default" },
    ] },
    { id: "art", label: "ART", live: "commit", fields: [
      { id: "size", type: "mm", label: "shape size", range: [8, 16], step: 1, default: 14,
        help: "the extent of each shape, mm" },
      { id: "stroke", type: "mm", label: "stroke", range: [0.8, 2], step: 0.1, default: 1.2,
        help: "stroke and gap width of the shapes, mm" },
      { id: "seed", type: "int", label: "circuit seed", range: [1, 999], step: 1, default: 7,
        help: "one seed gives one board on every machine" },
    ] },
  ],
  build: { module: "./build.ts", fn: "build" },
  exports: [{ kind: "3mf", machine: "ffc5p", pose: "print" }, { kind: "stl" }, { kind: "card" }],
  assertions: [],
});


// ---- bench: the steps and panels
const bench = defineBench(chase, {
  shell: "paper",
  views: { default: "assembled", modes: ["assembled"], render: ["solid"], overlays: ["busy", "welcome"], cams: ["iso", "top"], stage: "graph" },
  rail: [
    { step: "plate", goal: "size the plate and set the inlay.", panels: ["params.blank", "params.inlay", "params.art"], focus: "plate" },
    { step: "print", goal: "save the design file or the 3mf.", panels: ["exports"], focus: "export" },
  ],
  welcome: { tagline: "a plate with inlaid art", presets: [], starts: [] },
  status: ["build.hash"],
});

// ---- build: the geometry, written against the author API
// reference/cosmetic/art-layers/build.ts
// The art-layers build: a prism blank in slot 1 and one `inlay` feature per
// art slot, each carrying the whole art, both faces, under its content
// address (packages/inlay/src/kind.ts artUri), as cosmetic/coin-inlay does.
// The layers are the lowered form of the art document in packages/inlay/test/
// art-layers.test.ts (spec/art.ts, lowered by packages/inlay/src/
// art-lower.ts): a build.ts may import only spec, so it writes the
// painter layers as data, and that test holds them equal to the document.
//
// Front face as read in hand, three rows of six cells (pitch 16 mm by 20 mm
// at the default): row 1 ring, rect, ellipse, frame, diamond, chevrons;
// row 2 grid, sun, saguaro, mesa, zigzag, steps; row 3 arrow, scope,
// circuit, the hack.build mark and a line of text across the last two
// cells. Back face: two arcs of text, spaced text and an arrow. Slots
// alternate 2 and 3 along each row, so every kind paints at least once and
// each art slot has islands on both faces.

/** Slots the art paints. */
const SLOT = { body: 1, pink: 2, cream: 3 }         ;

/** The face the text is set in: a family the node text route carries, bold. */
const TEXT = { font: "IBM Plex Mono", bold: true }         ;

const SHAPES = [
  ["ring", "rect", "ellipse", "frame", "diamond", "chevrons"],
  ["grid", "sun", "saguaro", "mesa", "zigzag", "steps"],
  ["arrow"],
]         ;

const build = defineBuild(chase, (p, k) => {
  const m = k.machine("ffc5p");
  const layers = Math.round(p.depth / m.layerHeight);
  if (layers < 1 || Math.abs(layers * m.layerHeight - p.depth) > 1e-6) {
    throw commandError({
      code: "E_SCHEMA", path: "/depth", got: p.depth, expected: `a whole number of ${m.layerHeight} mm layers on ${m.id}`,
      hint: `set depth to ${(Math.max(1, Math.floor(p.depth / m.layerHeight)) * m.layerHeight).toFixed(2)} or ${((Math.floor(p.depth / m.layerHeight) + 1) * m.layerHeight).toFixed(2)} mm (computed)`,
    });
  }
  const pitchX = (p.w - 4) / 6, rowY = [20, 0, -20]         ;
  if (p.size + 2 > pitchX || p.h / 2 < rowY[0] + p.size / 2 + 1) {
    throw commandError({
      code: "E_SCHEMA", path: "/size", got: p.size, expected: `shapes inside their cell: under ${(pitchX - 2).toFixed(1)} mm across and ${(2 * (p.h / 2 - 1 - rowY[0])).toFixed(1)} mm tall`,
      hint: "make the shapes smaller or the plate larger",
    });
  }
  const cx = (c        )         => -p.w / 2 + 2 + pitchX * (c + 0.5);
  const S = p.size, t = p.stroke;
  const plate = k.body("plate", { role: "body", slot: SLOT.body, material: "petg", base: { route: "prism", outline: [k.ring.roundRect(p.w, p.h, 2)], z: [0, p.thk] } });
  const top            = { origin: [0, 0, p.thk], normal: [0, 0, 1], u: [1, 0, 0] };
  const palette = [...chase.materials].sort((a, b) => a.slot - b.slot).map((s) => s.preview);

  // One shape layer per cell; extents follow BAIL's presets (ellipse and arrow are wider than tall).
  const shape = (name        , col        , row        , slot        ) => {
    const w = name === "saguaro" ? 0.86 * S : S, h = name === "ellipse" ? 0.7 * S : name === "arrow" ? 0.55 * S : S;
    const stroke = name === "grid" ? 0.8 : name === "sun" ? 1.4 : t;
    return { kind: "shape", shape: name, w, h, t: stroke, n: name === "grid" ? 4 : name === "sun" ? 4 : name === "steps" ? 3 : name === "zigzag" ? 3 : 4, dx: cx(col), dy: rowY[row] , rot: 0, slot };
  };
  const front            = [];
  SHAPES[0].forEach((name, c) => front.push(shape(name, c, 0, c % 2 === 0 ? SLOT.pink : SLOT.cream)));
  SHAPES[1].forEach((name, c) => front.push(shape(name, c, 1, c % 2 === 0 ? SLOT.cream : SLOT.pink)));
  front.push(shape("arrow", 0, 2, SLOT.pink));
  front.push({ kind: "scope", a: 3, b: 2, phase: 90, w: S, h: 0.86 * S, t: 0.8, dx: cx(1), dy: rowY[2], rot: 0, slot: SLOT.cream });
  front.push({ kind: "circuit", seed: p.seed, w: S, h: S, pitch: 2.4, tw: 0.8, pad: 2.2, drill: 0.7, density: 1, clip: "ellipse", dx: cx(2), dy: rowY[2], rot: 0, slot: SLOT.pink, slot2: SLOT.cream });
  front.push({ kind: "logo", brand: "hb", w: S, dx: cx(3), dy: rowY[2], rot: 0, slot: SLOT.cream, slot2: SLOT.pink });
  front.push({
    kind: "text", text: "hack|.build", slot: SLOT.pink, accent: SLOT.cream, font: TEXT.font, bold: TEXT.bold, size: 4, runGap: 0.6,
    mode: "straight", dx: (cx(4) + cx(5)) / 2, dy: rowY[2], rot: 0, baseline: "middle", ls: 0.3,
  });
  const arc = (text        , radius        , slot        ) => ({
    kind: "text", text, slot, font: TEXT.font, bold: TEXT.bold, size: 5, runGap: 0, mode: "arc",
    arcR: Math.abs(radius), arcDeg: radius > 0 ? 90 : -90, flip: radius < 0, anchored: true, dx: 0, dy: 0, rot: 0, baseline: "middle", ls: 0.6,
  });
  const back = [
    arc("MAKE THINGS", 24, SLOT.pink),
    arc("BREAK THINGS", -24, SLOT.cream),
    {
      kind: "text", text: "REPEAT", slot: SLOT.pink, font: TEXT.font, bold: TEXT.bold, size: 6, runGap: 0, mode: "straight",
      dx: 0, dy: 6, rot: 0, baseline: "middle", ls: 0.5,
    },
    { ...shape("arrow", 0, 2, SLOT.cream), dx: 0, dy: -6, w: 1.6 * S },
  ];

  const art = {
    grid: { w: Math.round(p.w * p.cells), h: Math.round(p.h * p.cells), res: p.cells },
    layers: { top: front, bed: back },
    recipe: "print-forge",
    boost: p.boost,
    gap: p.gap,
    palette,
    minFeature: p.minF,
    despeckle: k.profile.constant("despeckle.factor").value,
  };
  const uri = `hbf://art/${sha256Hex(canonicalize(art))}`;
  const inlay = (name        , slot        ) => k.bind({
    kind: "inlay"         , id: `inlay.${name}`, body: plate.id, art: uri, face: top, slot,
    depthLayers: layers, minFeature: art.minFeature, despeckle: art.despeckle,
    grid: art.grid, layers: art.layers, recipe: art.recipe, boost: art.boost, gap: art.gap, palette: art.palette,
    material: "petg",
  }, { depthLayers: "/depth", minFeature: "/minF" });
  return k.part({
    id: "plate", name: "art layers", process: "fdm", machine: "ffc5p",
    bodies: [plate],
    features: [inlay("pink", SLOT.pink), inlay("cream", SLOT.cream)],
    faces: [k.face("plate.top", top)],
  });
});

// ---- run: the engine builds, the bench draws
const source = document.querySelector("script[data-hbf-page]").textContent;
const page = createPageBuild({ chase, module: { build }, facts: factsFor(chase, source) });
const controller = createBench({ chase, bench, ...pageBench(page), hook: true, offline: { inline: true } });
controller.mount(document.getElementById("app"));
globalThis.hbfSkill = controller;
</script>
</body>
</html>
