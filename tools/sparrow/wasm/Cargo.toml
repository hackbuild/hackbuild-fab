# M07-T13: the wasm build of sparrow for the evaluation only (D-137). The
# wrapper is ported from sparrow-studio web/wasm/src/lib.rs (MIT, commit
# a738c18d9c28e371983b164129190dad1616d273) with the solver settings of
# sparrow's own CLI (src/cli.rs at the pinned commit), so the native and the
# wasm runs take one configuration. tools/sparrow/build.sh copies this crate
# beside the pinned sparrow checkout, links the checkout in as ./sparrow and
# builds it there; nothing under packages/ depends on it. The dependency
# sits inside this crate's root because cargo hashes a path dependency
# outside the root by its absolute path into the crate id, which reorders
# the wasm data and changed its bytes with the build folder (M07 audit).
[package]
name = "hbf-sparrow-wasm"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
sparrow = { path = "sparrow" }
jagua-rs = { version = "=1.0.0", features = ["spp"] }
rand = "0.10"
serde_json = "1.0"
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
