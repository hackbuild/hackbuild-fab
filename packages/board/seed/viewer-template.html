<html lang="en">
<head>
<meta charset="utf-8">

<title>DEMO R0 // board viewer</title>

<style>
:root{
  --pink:#FE0386; --cream:#f5f0e6; --ink:#1a1a1a; --dark:#0a0a0a;
  --gold:#d9b45a;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --type:'Special Elite','Courier New',monospace;
  --marker:'Permanent Marker',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--mono);font-size:13px;
  background-image:radial-gradient(rgba(26,26,26,.045) 1px,transparent 1px);
  background-size:4px 4px;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--ink);color:var(--cream);padding:8px 14px;display:flex;
  align-items:center;gap:14px;flex:0 0 auto;border-bottom:3px solid var(--pink)}
header .mark{width:26px;height:26px;flex:0 0 auto}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--marker);font-size:22px;letter-spacing:1px;line-height:1}
.brand h1 span{color:var(--pink)}
.rev{font-size:11px;opacity:.72;letter-spacing:2px;text-transform:uppercase}
.tagline{font-family:var(--type);font-size:11px;opacity:.6;margin-left:auto;text-align:right}
nav{display:flex;background:var(--ink);flex:0 0 auto;padding:0 14px;
  border-bottom:1px solid rgba(245,240,230,.15)}
nav button{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:1.5px;
  background:transparent;color:rgba(245,240,230,.55);border:0;padding:7px 14px;
  cursor:pointer;border-bottom:3px solid transparent}
nav button:hover{color:var(--cream)}
nav button.on{color:var(--cream);border-bottom-color:var(--pink)}
main{flex:1;display:flex;min-height:0}
.page{flex:1;display:none;min-width:0;min-height:0}
.page.on{display:flex}
#p-board{flex-direction:row}
#svgwrap{flex:1 1 0;min-width:0;min-height:0;cursor:grab;position:relative}
#svgwrap.drag{cursor:grabbing}
#board{width:100%;height:100%;display:block;touch-action:none}
#sidebar{flex:0 0 280px;overflow-y:auto;background:#efe9db;
  border-left:3px solid var(--ink);padding:12px;display:flex;flex-direction:column;gap:10px}
.ctl h2{font-size:11px;letter-spacing:2px;border-bottom:2px solid var(--ink);padding-bottom:3px;margin-bottom:6px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
button.b{font:inherit;font-weight:600;font-size:11px;background:var(--ink);color:var(--cream);
  border:0;padding:5px 10px;cursor:pointer;letter-spacing:1px}
button.b:hover{background:var(--pink)}
button.b.on{background:var(--pink)}
input[type=text]{font:inherit;width:100%;padding:5px 8px;background:var(--cream);
  border:2px solid var(--ink);outline:none}
input[type=text]:focus{border-color:var(--pink)}
label.tg{display:flex;align-items:center;gap:7px;font-size:12px;padding:2px 0;cursor:pointer}
input[type=checkbox]{accent-color:var(--pink);width:14px;height:14px}
#zonebtns button.b{opacity:.9}
#inspector{font-size:12px}
#inspector .card{background:var(--cream);border:2px solid var(--ink);padding:10px}
#inspector .ref{font-family:var(--marker);font-size:24px;color:var(--pink)}
#inspector .val{font-weight:700;margin-bottom:6px}
#inspector .note{font-family:var(--type);font-size:11.5px;line-height:1.45;
  border-left:3px solid var(--pink);padding-left:8px;margin:8px 0}
#inspector .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:11px}
#inspector .kv b{letter-spacing:1px;font-size:10px;opacity:.7}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.chip{background:var(--ink);color:var(--cream);font-size:10px;padding:2px 7px;
  cursor:pointer;letter-spacing:.5px}
.chip:hover{background:var(--pink)}
.pagepad{flex:1;overflow:auto;padding:18px}
table{border-collapse:collapse;font-size:12px;width:100%;max-width:980px;background:var(--cream)}
th{font-size:10px;letter-spacing:1.5px;text-align:left;border-bottom:3px solid var(--ink);
  padding:6px 10px;text-transform:uppercase}
td{border-bottom:1px solid rgba(26,26,26,.25);padding:5px 10px;vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:rgba(254,3,134,.08)}
.tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.5px;
  padding:1px 7px;color:#fff;border-radius:2px}
h2.ph{font-family:var(--marker);font-size:22px;margin-bottom:12px}
h2.ph span{color:var(--pink)}
.fabnote{font-family:var(--type);max-width:760px;line-height:1.6;font-size:13px}
.fabnote li{margin:6px 0 6px 18px}
footer{font-size:10px;padding:5px 14px;border-top:2px solid var(--ink);opacity:.8;flex:0 0 auto}
kbd{background:var(--ink);color:var(--cream);padding:0 5px;font-size:10px}
</style>
</head>

dimline(-3,0,-3,BD.h,BD.h+"mm");
gDim.style.display="none";
setVB();

/* one paint() owns highlight state */
let selected=null, zoneFilter=null, netFilter=null, query="", side="T";
const insp=document.getElementById("inspector");
function matches(p){
  if(!query) return true;
  return (p.ref+" "+p.val+" "+(p.mpn||"")+" "+(p.note||"")).toLowerCase().includes(query);
}
function paint(){
  const filt = zoneFilter||netFilter||query;
  P.forEach(p=>{
    const g=partNode[p.ref];
    const onSide=(p.side||"T")===side;
    g.style.display = onSide ? "" : "none";
    if(!onSide) return;
    const zc=g.querySelector(".zc"), body=g.querySelector(".body");
    let hit = true;
    if(zoneFilter) hit = hit && p.zone===zoneFilter;
    if(netFilter)  hit = hit && (p.nets||[]).includes(netFilter);
    if(query)      hit = hit && matches(p);
    zc.setAttribute("opacity", filt && hit ? .95 : 0);
    body.setAttribute("opacity", filt && !hit ? .3 : .92);
    g.querySelector(".refdes").setAttribute("fill", filt && hit ? "#1a1a1a" : "#ffffff");
    if(p.ref===selected){
      zc.setAttribute("opacity",1); zc.setAttribute("fill","#ffffff");
      body.setAttribute("opacity",1);
      g.querySelector(".refdes").setAttribute("fill","#1a1a1a");
    } else zc.setAttribute("fill",ZC[p.zone]||"#cccccc");
  });
  document.querySelectorAll(".cu").forEach(c=>{
    if(netFilter){
      const hit = c.dataset.net===netFilter;
      c.setAttribute("opacity", hit ? 1 : .25);
      c.setAttribute("stroke", hit ? "#ffffff" : "none");
      c.setAttribute("stroke-width", hit ? .18 : 0);
    } else { c.setAttribute("opacity",.9); c.setAttribute("stroke","none"); }
  });
  document.querySelectorAll(".padc").forEach(c=>{
    c.setAttribute("opacity", netFilter ? (c.dataset.net===netFilter ? 1 : .3) : 1);
  });
  document.getElementById("foot").textContent =
    `${BD.name} ${BD.rev}  |  ${BD.w}x${BD.h}mm ${BD.layers}L ${BD.finish}`
    + `  |  side ${side==="T"?"TOP":"BOTTOM (mirrored)"}`
    + (netFilter?`  |  net ${netFilter}`:"") + (zoneFilter?`  |  zone ${zoneFilter}`:"");
}
function setSide(s){
  side=s; sideMirror = s==="T" ? 1 : -1;
  gSide.setAttribute("transform", s==="T" ? "" : `translate(${BD.w},0) scale(-1,1)`);
  document.querySelectorAll(".ft").forEach(flipText);
  for(const [g,on] of [[gCuF,s==="T"],[gCuB,s==="B"],[gPadsF,s==="T"],
      [gPadsB,s==="B"],[gSilkT,s==="T"],[gSilkB,s==="B"]])
    g.style.display = on ? "" : "none";
  document.getElementById("side-T").classList.toggle("on", s==="T");
  document.getElementById("side-B").classList.toggle("on", s==="B");
  paint();
}
function select(ref){
  selected=ref; netFilter=null;
  const p=P.find(q=>q.ref===ref);
  insp.innerHTML = `<div class="card">
      <div class="ref">${p.ref}</div>
      <div class="val">${p.val}${(p.side||"T")==="B"?"  [BACK]":""}</div>
      <div class="note">${p.note||"-"}</div>
      <div class="kv">
        <b>PACKAGE</b><span>${p.pkg||"-"}</span>
        <b>FOOTPRINT</b><span style="word-break:break-all">${p.fp||"-"}</span>
        <b>MPN</b><span>${p.mpn||"-"}</span>
        <b>LCSC</b><span>${p.lcsc||"-"}</span>
        <b>POSITION</b><span>${p.x} , ${p.y} mm  rot ${p.rot}</span>
        <b>ZONE</b><span>${p.zone||"-"}</span>
      </div>
      <h3 style="margin-top:10px;font-size:11px;letter-spacing:1px">NETS</h3>
      <div class="chips">${(p.nets||[]).map(n=>`<span class="chip" data-net="${n}">${n}</span>`).join("")}</div>
    </div>`;
  insp.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>showNet(c.dataset.net)));
  if((p.side||"T")!==side) setSide(p.side||"T"); else paint();
}
function showNet(net){
  netFilter=net; selected=null; zoneFilter=null;
  document.querySelectorAll("#zonebtns button").forEach(b=>b.classList.remove("on"));
  const conns=(D.nets&&D.nets[net])||[];
  insp.innerHTML=`<div class="card">
      <div class="ref" style="font-size:19px">${net}</div>
      <div class="val">${conns.length} connections</div>
      <table style="margin-top:8px"><thead><tr><th>Ref</th><th>Pin</th><th>Function</th></tr></thead>
      <tbody>${conns.map(c=>`<tr class="row" data-ref="${c[0]}"><td><b>${c[0]}</b></td><td>${c[1]}</td><td>${c[2]}</td></tr>`).join("")}</tbody></table>
      <div class="btnrow" style="margin-top:8px"><button class="b" id="netclr">CLEAR</button></div>
    </div>`;
  document.getElementById("netclr").addEventListener("click",clearAll);
  insp.querySelectorAll("tr.row").forEach(r=>r.addEventListener("click",()=>select(r.dataset.ref)));
  paint();
}
function clearAll(){
  selected=null; zoneFilter=null; netFilter=null; query="";
  document.getElementById("q").value="";
  document.querySelectorAll("#zonebtns button").forEach(b=>b.classList.remove("on"));
  insp.innerHTML=`<div class="card"><div class="note">Click a part. Click a net
    chip to trace its copper. <kbd>Esc</kbd> clears, double click fits.</div></div>`;
  paint();
}
svg.addEventListener("click",clearAll);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") clearAll(); });

const zb=document.getElementById("zonebtns");
(D.zones||[]).forEach(z=>{
  const b=document.createElement("button"); b.className="b"; b.textContent=z;
  b.style.background=ZC[z]||"#cccccc"; b.style.color="#1a1a1a";
  b.addEventListener("click",()=>{
    zoneFilter = zoneFilter===z ? null : z; netFilter=null; selected=null;
    zb.querySelectorAll("button").forEach(x=>x.classList.remove("on"));
    if(zoneFilter) b.classList.add("on");
    paint();
  });
  zb.appendChild(b);
});
const toggles={ "l-mask":gMask, "l-keep":gKeep, "l-dim":gDim };
for(const id in toggles){
  document.getElementById(id).addEventListener("change",e=>{
    toggles[id].style.display = e.target.checked ? "" : "none";});
}
document.getElementById("l-cu").addEventListener("change",e=>{
  gCuF.style.opacity = gCuB.style.opacity = e.target.checked ? "" : "0";});
document.getElementById("l-pads").addEventListener("change",e=>{
  [gPadsF,gPadsB,gVia].forEach(g=>g.style.opacity=e.target.checked?"":"0");});
document.getElementById("l-parts").addEventListener("change",e=>{
  gParts.style.display = e.target.checked ? "" : "none";});
document.getElementById("l-silk").addEventListener("change",e=>{
  [gSilkT,gSilkB].forEach(g=>g.style.visibility=e.target.checked?"":"hidden");});
document.getElementById("l-ref").addEventListener("change",e=>{
  document.querySelectorAll(".refdes").forEach(t=>t.style.display=e.target.checked?"":"none");});
document.getElementById("l-dim").checked=false;
document.getElementById("side-T").addEventListener("click",()=>setSide("T"));
document.getElementById("side-B").addEventListener("click",()=>setSide("B"));
document.getElementById("q").addEventListener("input",e=>{
  query=e.target.value.trim().toLowerCase(); paint();});

const wrap=document.getElementById("svgwrap");
let drag=null;
wrap.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,v:{...view}};
  wrap.classList.add("drag");wrap.setPointerCapture(e.pointerId);});
wrap.addEventListener("pointermove",e=>{
  if(!drag)return; const r=wrap.getBoundingClientRect();
  const sx=view.w/r.width, sy=view.h/r.height;
  view.x=drag.v.x-(e.clientX-drag.x)*sx; view.y=drag.v.y-(e.clientY-drag.y)*sy; setVB();});
wrap.addEventListener("pointerup",e=>{drag=null;wrap.classList.remove("drag");
  wrap.releasePointerCapture(e.pointerId);});
wrap.addEventListener("wheel",e=>{
  e.preventDefault(); const r=wrap.getBoundingClientRect();
  const mx=view.x+(e.clientX-r.left)/r.width*view.w;
  const my=view.y+(e.clientY-r.top)/r.height*view.h;
  const k=e.deltaY>0?1.12:1/1.12;
  view.w*=k; view.h*=k;
  view.x=mx-(mx-view.x)*k; view.y=my-(my-view.y)*k; setVB();},{passive:false});
function fit(){ view={...VB}; setVB(); }
document.getElementById("fit").addEventListener("click",fit);
wrap.addEventListener("dblclick",fit);

document.getElementById("gpiorows").innerHTML=(D.gpio||[]).map(([pin,sig,desc,cls])=>{
  const pad=(Object.entries(D.nets||{}).flatMap(([n,cs])=>cs
    .filter(c=>c[0]==="U1"&&c[2]===pin).map(c=>c[1])))[0]||"-";
  const CLSC={i2c:"#7ad0ff",pwm:"#ff6ba8",uart:"#9fd356",usb:"#c39bff",strap:"#ffab5e"};
  return `<tr class="row" data-net="${sig}"><td><b>${pin}</b></td><td>${sig}</td>
    <td>${pad}</td><td>${desc}</td>
    <td><span class="tag" style="background:${CLSC[cls]||"#888888"}">${cls}</span></td></tr>`;
}).join("");
document.querySelectorAll("#gpiorows tr.row").forEach(r=>r.addEventListener("click",()=>{
  showTab("board"); if(D.nets[r.dataset.net]) showNet(r.dataset.net);}));

const NT={src:"#1a1a1a",prot:"#8a4b00",conv:"#FE0386",rail:"#0b6b57",load:"#00596b"};
(function(){
  const nodes=D.power_nodes||[], edges=D.power_edges||[];
  if(!nodes.length){document.getElementById("ptree").textContent="no power data";return;}
  const CW=150, RH=88,
        W=(Math.max(...nodes.map(n=>n.col))+1)*CW+80,
        H=(Math.max(...nodes.map(n=>n.row))+1)*RH+60;
  const s=el("svg",{viewBox:`0 0 ${W} ${H}`,style:"width:100%;max-width:1180px"});
  const pos={};
  nodes.forEach(n=>{pos[n.id]={x:30+n.col*CW,y:26+n.row*RH};});
  edges.forEach(([a,b])=>{
    const A=pos[a],B=pos[b]; const ax=A.x+104,ay=A.y+21,bx=B.x,by=B.y+21;
    const mx=(ax+bx)/2;
    s.appendChild(el("path",{d:`M${ax},${ay}H${mx}V${by}H${bx}`,fill:"none",
      stroke:"#b0b8c0","stroke-width":1.6}));
    s.appendChild(el("path",{d:`M${bx-6},${by-4}L${bx},${by}L${bx-6},${by+4}Z`,fill:"#b0b8c0"}));
  });
  nodes.forEach(n=>{
    const p=pos[n.id];
    s.appendChild(el("rect",{x:p.x,y:p.y,width:104,height:42,rx:4,fill:NT[n.type]||"#555555"}));
    const t=el("text",{x:p.x+52,y:p.y+18,"text-anchor":"middle",fill:"#fff",
      "font-size":11,"font-weight":700,"font-family":"IBM Plex Mono, monospace"});
    t.textContent=n.label; s.appendChild(t);
    if(n.sub){const u=el("text",{x:p.x+52,y:p.y+32,"text-anchor":"middle",fill:"#fff",
      "font-size":9,opacity:.85,"font-family":"IBM Plex Mono, monospace"});
      u.textContent=n.sub; s.appendChild(u);}
  });
  document.getElementById("ptree").appendChild(s);
})();
document.getElementById("bomrows").innerHTML=(D.bom||[]).map(l=>
  `<tr class="row" data-ref="${l.refs[0]}"><td>${l.qty}</td><td><b>${l.val}</b></td>
   <td>${l.mpn||"-"}</td><td>${l.lcsc||"-"}</td><td>${l.pkg||"-"}</td>
   <td>${l.refs.join(" ")}</td></tr>`).join("");
document.querySelectorAll("#bomrows tr.row").forEach(r=>r.addEventListener("click",()=>{
  showTab("board"); select(r.dataset.ref);}));
document.getElementById("fab").innerHTML=(D.fab||[]).map(x=>`<li>${x}</li>`).join("");
function showTab(name){
  ["board","pinmap","power","bom","fab"].forEach(t=>{
    document.getElementById("t-"+t).classList.toggle("on",t===name);
    document.getElementById("p-"+t).classList.toggle("on",t===name);
  });
}
["board","pinmap","power","bom","fab"].forEach(t=>
  document.getElementById("t-"+t).addEventListener("click",()=>showTab(t)));
setSide("T");

</script>
</body></html>
