<script type="application/hbf-draft+json">{"goal":"access switch","from":"reference:click-spring-window","chase":"// .hbf/drafts/access-switch/chase.ts\n// The click-spring window reference (M01-T07, D-071): the PIP click spring\n// at its defaults, the beam that sim/click-spring-window bounds over Q. A\n// chase declares and never computes (D-178): one defineChase over a\n// literal; the geometry is in build.ts beside it.\n//\n// Defaults are PIP's `clicky` row (haft-src/src/layout.js line 36): span l\n// 24 mm, beam t 0.55 mm, rise Q 2.0 x t, width w 1.6 mm, beam gap g 1.0 mm,\n// shuttle sw 3.0 mm. E (1900 MPa) is the petg modulus row in profile, so\n// the chase carries no modulus. Each default lands on its step from the\n// range minimum (G-09). Q carries constraintDim spring.Q, so a param-form\n// query and the parity edit (Q one step up, 2.01) both reach the window.\n\nimport { defineChase, type ParamsOf } from \"@hackbuild/spec\";\n\nexport const chase = defineChase({\n  meta: {\n    id: \"access-switch\", kind: \"single\", name: \"CLICK SPRING\", version: 1, chase: 2,\n    kernels: [\"geom\", \"mesh\", \"sim\", \"3mf\"], machines: [\"ffc5p\"],\n    license: \"CC-BY-SA-4.0\",\n    derivedFrom: { id: \"click-spring-window\", buildHash: \"35baf9086cd7c5964a7bb1549d1e386b0fba327c5289ff7e1da8c9de96334f64\" },\n  },\n  // PIP prints the click elements in PETG on slot 1 (pip.md 5.2).\n  materials: [\n    { slot: 1, material: \"petg\", role: \"body\", label: \"spring\", preview: \"#F4F1EA\" },\n  ],\n  params: [\n    { id: \"clicky\", label: \"CLICK SPRING\", live: \"commit\", fields: [\n      { id: \"l\", type: \"mm\", label: \"span\", range: [12, 36], step: 0.5, default: 24, help: \"span between the end blocks\" },\n      { id: \"t\", type: \"mm\", label: \"beam\", range: [0.35, 0.95], step: 0.05, default: 0.55, help: \"beam thickness in the bending plane\" },\n      { id: \"Q\", type: \"ratio\", label: \"rise\", range: [1, 2.6], step: 0.01, default: 2,\n        constraintDim: \"spring.Q\", help: \"rise over beam thickness\" },\n      { id: \"w\", type: \"mm\", label: \"width\", range: [0.8, 3.2], step: 0.1, default: 1.6, help: \"beam width, the print height\" },\n      { id: \"g\", type: \"mm\", label: \"beam gap\", range: [0.5, 2], step: 0.1, default: 1, help: \"gap between the two arches\" },\n      { id: \"sw\", type: \"mm\", label: \"shuttle\", range: [1, 6], step: 0.5, default: 3, help: \"rigid shuttle width at the centre\" },\n    ] },\n  ],\n  build: { module: \"./build.ts\", fn: \"build\" },\n  exports: [{ kind: \"3mf\", machine: \"ffc5p\", pose: \"print\" }],\n  assertions: [],\n});\n\n/** The params type a build function sees. */\nexport type ClickSpringParams = ParamsOf<typeof chase>;\n","build":"// .hbf/drafts/access-switch/build.ts\n// The PIP click spring's double cosine arch as two prisms on the M00 prism\n// route, printed flat: each arch is its centreline offset by t / 2 each\n// side, extruded by w (M01-T07 step 4). Ported from clickElement2D\n// (haft-src/src/model.js lines 683 to 694, the arch helper): the centreline\n// is v = vb + h / 2 (1 + cos(2 pi u / l)) over 64 segments, h = Q t, the\n// lower arch on vb 0 and the upper on vb t + g. Conditionals and loops live\n// here, never in chase.ts; its bytes enter defHash (D-174, D-178).\n//\n// Deviations from PIP, each named where it lands: the arch stops at the span\n// ends, without the 0.4 mm run-out into the end blocks, since this reference\n// builds no blocks, shuttle, tip or grooves. The FE readout (peak, drop,\n// contact, eStop) is not a metric here: build.ts imports only spec and the\n// author surface (BUILD_IMPORTS, D-178), and k.mech is outside the slice\n// until M06, so the window is proved by the query goldens in queries.json.\n\nimport { defineBuild, qualify, type Metric, type Ring, type Vec2 } from \"@hackbuild/spec\";\nimport { chase } from \"./chase\";\n\n/** Segments per arch edge (model.js line 686, n = 64); a discretization. */\nconst SEGMENTS = 64;\n\n/** One arch on base vb as a counter-clockwise ring: lower edge left to right, upper edge back. */\nfunction arch(l: number, h: number, t: number, vb: number): Ring {\n  const lower: Vec2[] = [];\n  const upper: Vec2[] = [];\n  for (let i = 0; i <= SEGMENTS; i++) {\n    const u = -l / 2 + (l * i) / SEGMENTS;\n    const v = vb + (h / 2) * (1 + Math.cos((2 * Math.PI * u) / l));\n    lower.push([u, v - t / 2]);\n    upper.push([u, v + t / 2]);\n  }\n  return [...lower, ...upper.reverse()];\n}\n\nexport const build = defineBuild(chase, (p, k) => {\n  const h = p.Q * p.t;\n  const bodies = [0, p.t + p.g].map((vb, i) =>\n    k.body(`arch${i + 1}`, { role: \"body\", slot: 1, base: { route: \"prism\", outline: [arch(p.l, h, p.t, vb)], z: [0, p.w] } }));\n  const metrics: Metric[] = [\n    { id: \"spring.riseMm\", value: Number(h.toFixed(4)), unit: \"mm\", ...qualify([]), note: \"rise h = Q t at the arch centre\",\n      drivenBy: [\"/Q\", \"/t\"], gate: \"informational\", group: \"spring\" },\n  ];\n  return k.part({\n    id: \"spring\", name: \"CLICK SPRING\", process: \"fdm\", machine: \"ffc5p\",\n    frame: { originOnAxis: false, carriesOffset: false, pose: \"print\" },\n    bodies, features: [], metrics, assertions: [],\n  });\n});\n","files":{},"widget":null,"state":{"l":24,"t":0.55,"Q":2,"w":1.6,"g":1,"sw":3},"kernelVersion":"0.0.0","defHash":"e616eeb6ed14f49b876f702096f54011b6170321591b6b3f5304ef87b3e48330"}</script>
